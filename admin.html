<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peque Elektro - Panel de Administración</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; padding: 20px; }
    .admin-container { max-width: 1100px; margin: 0 auto; }
    h1, h2 { color: #38bdf8; }
    .section-box { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
    input, select, button { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 14px; }
    button { background: #0284c7; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }
    .btn-success { background: #22c55e; }
    .btn-success:hover { background: #16a34a; }
    
    /* TABLA Y PEDIDOS */
    .pedido-card { background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    .pedido-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 10px; }
    .order-id { font-weight: bold; color: #38bdf8; font-size: 16px; }
    .order-date { font-size: 12px; color: #94a3b8; }
    .item-list { margin: 10px 0; padding-left: 20px; color: #cbd5e1; }
    .prod-admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
    .prod-card-admin { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; text-align: center; }
    .prod-card-admin img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="admin-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1><i class="fa-solid fa-user-gear"></i> Panel Admin - Peque Elektro</h1>
      <a href="index.html" style="color: #38bdf8; text-decoration: none;"><i class="fa-solid fa-store"></i> Ver Tienda Pública</a>
    </div>

    <!-- SECCIÓN PEDIDOS -->
    <section class="section-box">
      <h2><i class="fa-solid fa-receipt"></i> Pedidos Recibidos</h2>
      <div id="lista-pedidos">
        <p style="color: #94a3b8;">Cargando pedidos...</p>
      </div>
    </section>

    <!-- SECCIÓN CREAR / EDITAR PRODUCTO -->
    <section class="section-box">
      <h2 id="form-title"><i class="fa-solid fa-plus-circle"></i> Agregar Nuevo Producto</h2>
      <form id="form-producto">
        <input type="hidden" id="prod-id">
        <div class="grid-form">
          <input type="text" id="prod-nombre" placeholder="Nombre del producto" required>
          <input type="number" id="prod-precio" placeholder="Precio ($)" step="0.01" required>
          <input type="text" id="prod-categoria" placeholder="Categoría (ej: mochila)" required>
          <input type="text" id="prod-subcategoria" placeholder="Subcategoría (opcional)">
          <input type="text" id="prod-imagen" placeholder="URL de la imagen" required>
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="submit" id="btn-guardar"><i class="fa-solid fa-save"></i> Guardar Producto</button>
          <button type="button" id="btn-cancelar" class="btn-danger" style="display:none;" onclick="resetForm()"><i class="fa-solid fa-xmark"></i> Cancelar Edición</button>
        </div>
      </form>
    </section>

    <!-- SECCIÓN LISTA DE PRODUCTOS -->
    <section class="section-box">
      <h2><i class="fa-solid fa-boxes-stacked"></i> Catálogo de Productos Existentes</h2>
      <div id="grid-productos-admin" class="prod-admin-grid">
        <p style="color: #94a3b8;">Cargando productos...</p>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTtYfbeNy7z15Pj3Suli68mVGioMFU21E",
      authDomain: "peque-elektro.firebaseapp.com",
      projectId: "peque-elektro",
      storageBucket: "peque-elektro.firebasestorage.app",
      messagingSenderId: "873169424486",
      appId: "1:873169424486:web:e9f77cb2052aa06b3b9da7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let productos = [];

    // --- ESCUCHAR Y MOSTRAR PEDIDOS EN TIEMPO REAL ---
    function cargarPedidosRealtime() {
      const contenedor = document.getElementById('lista-pedidos');
      
      onSnapshot(collection(db, "pedidos"), (snap) => {
        if (snap.empty) {
          contenedor.innerHTML = `<p style="color: #94a3b8;">No hay pedidos registrados aún.</p>`;
          return;
        }

        let html = "";
        snap.forEach(documento => {
          const p = documento.data();
          const id = documento.id;
          const numOrden = `#ORD-${id.substring(0, 5).toUpperCase()}`;
          const fechaStr = p.fecha ? new Date(p.fecha.seconds * 1000).toLocaleString('es-AR') : 'Reciente';

          let itemsHtml = "";
          if (p.items && p.items.length > 0) {
            p.items.forEach(it => {
              itemsHtml += `<li><strong>${it.cantidad}x</strong> ${it.nombre} - $${(it.subtotal || 0).toLocaleString('es-AR')}</li>`;
            });
          }

          html += `
            <div class="pedido-card">
              <div class="pedido-header">
                <div>
                  <span class="order-id">${numOrden}</span>
                  <span class="order-date"> | ${fechaStr}</span>
                </div>
                <div>
                  <span style="padding: 4px 8px; border-radius: 4px; font-size: 12px; background: ${p.estado === 'Completado' ? '#16a34a' : '#eab308'}; color: white;">
                    ${p.estado || 'Pendiente'}
                  </span>
                  <button class="btn-danger" style="padding: 4px 8px; margin-left: 10px;" onclick="eliminarPedido('${id}')"><i class="fa-solid fa-trash"></i></button>
                </div>
              </div>
              <ul class="item-list">${itemsHtml}</ul>
              <div style="font-weight: bold; text-align: right; color: #38bdf8;">
                Total: $${(p.total || 0).toLocaleString('es-AR')}
              </div>
            </div>
          `;
        });

        contenedor.innerHTML = html;
      });
    }

    window.eliminarPedido = async (id) => {
      if (confirm("¿Estás seguro de eliminar este pedido?")) {
        await deleteDoc(doc(db, "pedidos", id));
      }
    };

    // --- CARGAR Y GESTIONAR PRODUCTOS ---
    async function cargarProductos() {
      const contenedor = document.getElementById('grid-productos-admin');
      const snap = await getDocs(collection(db, "productos"));
      productos = [];
      contenedor.innerHTML = "";

      if (snap.empty) {
        contenedor.innerHTML = `<p style="color: #94a3b8;">No hay productos registrados.</p>`;
        return;
      }

      snap.forEach(documento => {
        const prod = documento.data();
        const id = documento.id;
        productos.push({ id, ...prod });

        const imgUrl = (prod.imagenes && prod.imagenes[0]) || prod.imagen || 'https://via.placeholder.com/150';

        contenedor.innerHTML += `
          <div class="prod-card-admin">
            <img src="${imgUrl}" alt="${prod.nombre}" onerror="this.src='https://via.placeholder.com/150'">
            <h4 style="margin: 8px 0 4px 0; font-size: 14px;">${prod.nombre}</h4>
            <p style="color: #38bdf8; font-weight: bold; margin: 0 0 8px 0;">$${prod.precio}</p>
            <div style="display: flex; gap: 5px; justify-content: center;">
              <button class="btn-success" style="padding: 5px 10px;" onclick="prepararEdicion('${id}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn-danger" style="padding: 5px 10px;" onclick="eliminarProducto('${id}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      });
    }

    // FORMULARIO CREAR / EDITAR PRODUCTO
    document.getElementById('form-producto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('prod-id').value;
      const nombre = document.getElementById('prod-nombre').value;
      const precio = parseFloat(document.getElementById('prod-precio').value);
      const categoria = document.getElementById('prod-categoria').value;
      const subcategoria = document.getElementById('prod-subcategoria').value;
      const imagen = document.getElementById('prod-imagen').value;

      const data = {
        nombre,
        precio,
        categoria,
        subcategoria: subcategoria || "",
        imagenes: [imagen]
      };

      if (id) {
        // Actualizar
        await updateDoc(doc(db, "productos", id), data);
        alert("Producto actualizado correctamente.");
      } else {
        // Crear
        await addDoc(collection(db, "productos"), data);
        alert("Producto agregado correctamente.");
      }

      resetForm();
      cargarProductos();
    });

    window.prepararEdicion = (id) => {
      const p = productos.find(item => item.id === id);
      if (!p) return;

      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-nombre').value = p.nombre;
      document.getElementById('prod-precio').value = p.precio;
      document.getElementById('prod-categoria').value = p.categoria || "";
      document.getElementById('prod-subcategoria').value = p.subcategoria || "";
      document.getElementById('prod-imagen').value = (p.imagenes && p.imagenes[0]) || p.imagen || "";

      document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen"></i> Editar Producto`;
      document.getElementById('btn-guardar').innerHTML = `<i class="fa-solid fa-arrows-rotate"></i> Actualizar Producto`;
      document.getElementById('btn-cancelar').style.display = 'inline-block';
    };

    window.resetForm = () => {
      document.getElementById('form-producto').reset();
      document.getElementById('prod-id').value = "";
      document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-plus-circle"></i> Agregar Nuevo Producto`;
      document.getElementById('btn-guardar').innerHTML = `<i class="fa-solid fa-save"></i> Guardar Producto`;
      document.getElementById('btn-cancelar').style.display = 'none';
    };

    window.eliminarProducto = async (id) => {
      if (confirm("¿Seguro que deseas eliminar este producto?")) {
        await deleteDoc(doc(db, "productos", id));
        cargarProductos();
      }
    };

    // Inicializar
    cargarPedidosRealtime();
    cargarProductos();
  </script>
</body>
</html>
