<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Peque Elektro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .categories-bar, .subcategories-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 15px; }
    .btn-cat, .btn-subcat { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .btn-cat.active, .btn-cat:hover { background: #4f46e5; color: white; border-color: #4f46e5; }
    .btn-subcat.active, .btn-subcat:hover { background: #0d9488; color: white; border-color: #0d9488; }
    .subcategories-container { background: #0f172a; padding: 12px; border-radius: 12px; margin-bottom: 25px; }
    
    .admin-toolbar { background: #1e293b; padding: 15px; border-radius: 12px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 25px; border: 1px solid #334155; }
    .btn-tool { background: #475569; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .btn-tool:hover { background: #334155; }
    .btn-tool.primary { background: #4f46e5; }
    .btn-tool.primary:hover { background: #4338ca; }

    /* Modales */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s; }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal-content { background: #1e293b; color: #fff; padding: 25px; border-radius: 12px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; position: relative; text-align: left; }
    .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 0.9rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>Peque Elektro</h1>
    <p>Panel de Administración de Productos</p>
  </header>

  <main class="container">
    
    <!-- LOGIN -->
    <div id="login-section" style="max-width: 400px; margin: 40px auto; background: #1e293b; padding: 25px; border-radius: 12px; text-align: left;">
      <h2 style="text-align: center; margin-bottom: 20px;">Acceso Privado</h2>
      <div class="form-group"><input type="email" id="login-email" placeholder="Correo Electrónico"></div>
      <div class="form-group"><input type="password" id="login-pass" placeholder="Contraseña"></div>
      <button onclick="login()" style="width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Ingresar</button>
    </div>

    <!-- CONTENIDO ADMIN -->
    <div id="admin-content" class="hidden">
      
      <!-- BARRA DE HERRAMIENTAS -->
      <div class="admin-toolbar">
        <button class="btn-tool primary" onclick="abrirModal('modal-producto')"><i class="fa-solid fa-plus"></i> Cargar Producto</button>
        <button class="btn-tool" onclick="abrirModal('modal-categoria')"><i class="fa-solid fa-folder-plus"></i> Crear Categoría</button>
        <button class="btn-tool" onclick="abrirModal('modal-password')"><i class="fa-solid fa-key"></i> Cambiar Clave</button>
        <button class="btn-tool" onclick="logout()" style="background: #ef4444;"><i class="fa-solid fa-power-off"></i> Salir</button>
      </div>

      <!-- FILTROS -->
      <div id="categories-container" class="categories-bar"></div>
      <div id="subcategories-wrapper" class="subcategories-container hidden">
        <div id="subcategories-container" class="subcategories-bar"></div>
      </div>

      <!-- GRILLA DE PRODUCTOS ESTILO FRAVEGA -->
      <div id="grid-productos" class="grid-productos"></div>

    </div>
  </main>

  <!-- MODAL: CARGAR / EDITAR PRODUCTO -->
  <div id="modal-producto" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" onclick="cerrarModal('modal-producto')">&times;</button>
      <h2 id="form-title">Cargar Producto</h2>
      <form id="product-form">
        <input type="hidden" id="edit-id">
        <div class="form-group"><label>Nombre del Producto</label><input type="text" id="prod-title" required></div>
        <div style="display: flex; gap: 10px;">
          <div class="form-group" style="flex:1;"><label>Categoría</label><select id="prod-category" onchange="actualizarSubcategoriasUI()" required></select></div>
          <div class="form-group" style="flex:1;"><label>Subcategoría</label><select id="prod-subcategory" required disabled></select></div>
        </div>
        <div class="form-group"><label>Precio ($)</label><input type="number" id="prod-price" required></div>
        <div class="form-group"><label>Descripción</label><textarea id="prod-desc" rows="3" required></textarea></div>
        <div class="form-group">
          <label>Links de Fotos (Directos de ImgBB)</label>
          <input type="text" id="prod-img-1" placeholder="Foto 1 (Principal)" style="margin-bottom:5px;" required>
          <input type="text" id="prod-img-2" placeholder="Foto 2" style="margin-bottom:5px;">
          <input type="text" id="prod-img-3" placeholder="Foto 3" style="margin-bottom:5px;">
          <input type="text" id="prod-img-4" placeholder="Foto 4" style="margin-bottom:5px;">
          <input type="text" id="prod-img-5" placeholder="Foto 5">
        </div>
        <button type="submit" style="width:100%; padding:12px; background:#4f46e5; border:none; color:white; border-radius:8px; font-weight:bold; cursor:pointer;">Guardar Producto</button>
      </form>
    </div>
  </div>

  <!-- MODAL: CREAR CATEGORÍA -->
  <div id="modal-categoria" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" onclick="cerrarModal('modal-categoria')">&times;</button>
      <h2>Nueva Categoría</h2>
      <form id="cat-form">
        <div class="form-group"><label>Categoría Principal (Ej: TV y Audio)</label><input type="text" id="new-cat-name" required></div>
        <div class="form-group"><label>Subcategoría (Ej: Smart TVs)</label><input type="text" id="new-subcat-name" required></div>
        <button type="submit" style="width:100%; padding:12px; background:#0d9488; border:none; color:white; border-radius:8px; font-weight:bold; cursor:pointer;">Crear Categoría</button>
      </form>
    </div>
  </div>

  <!-- MODAL: CAMBIAR CONTRASEÑA -->
  <div id="modal-password" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" onclick="cerrarModal('modal-password')">&times;</button>
      <h2>Cambiar Contraseña</h2>
      <form id="pass-form">
        <div class="form-group"><label>Nueva Contraseña (Mín. 6 caracteres)</label><input type="password" id="new-pass" required minlength="6"></div>
        <button type="submit" style="width:100%; padding:12px; background:#f59e0b; border:none; color:white; border-radius:8px; font-weight:bold; cursor:pointer;">Actualizar Contraseña</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTtYfbeNy7z15Pj3Suli68mVGioMFU21E",
      authDomain: "peque-elektro.firebaseapp.com",
      projectId: "peque-elektro",
      storageBucket: "peque-elektro.firebasestorage.app",
      messagingSenderId: "873169424486",
      appId: "1:873169424486:web:e9f77cb2052aa06b3b9da7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let productosData = [];
    let categoriasLista = [];
    let catSeleccionada = "Todas";
    let subcatSeleccionada = "Todas";

    // AUTH
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('admin-content').classList.remove('hidden');
        cargarTodo();
      } else {
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('admin-content').classList.add('hidden');
      }
    });

    window.login = async () => {
      try {
        await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-pass').value);
      } catch (e) { alert("Error al ingresar: " + e.message); }
    };
    window.logout = () => signOut(auth);

    // CAMBIO DE CLAVE
    document.getElementById('pass-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await updatePassword(auth.currentUser, document.getElementById('new-pass').value);
        alert("Contraseña actualizada con éxito. Inicia sesión nuevamente.");
        cerrarModal('modal-password');
        logout();
      } catch (e) { alert("Error: " + e.message); }
    });

    // MODALES
    window.abrirModal = (id) => { 
      if(id === 'modal-producto' && !document.getElementById('edit-id').value) {
        document.getElementById('product-form').reset();
        document.getElementById('form-title').innerText = "Cargar Producto";
        document.getElementById('prod-subcategory').disabled = true;
      }
      document.getElementById(id).classList.add('active'); 
    };
    window.cerrarModal = (id) => { 
      document.getElementById(id).classList.remove('active'); 
      if(id === 'modal-producto') document.getElementById('edit-id').value = ""; 
    };

    // CARGA DE DATOS
    async function cargarTodo() {
      await cargarCategorias();
      try {
        const snap = await getDocs(collection(db, "productos"));
        productosData = [];
        snap.forEach(doc => {
          const prod = doc.data();
          const imagenes = prod.imagenes && prod.imagenes.length > 0 ? prod.imagenes : [prod.imagen];
          productosData.push({ id: doc.id, ...prod, imagenes });
        });
        generarCategoriasUI();
        renderizarProductos();
      } catch (e) { console.error(e); }
    }

    async function cargarCategorias() {
      try {
        const snap = await getDocs(collection(db, "categorias"));
        categoriasLista = [];
        snap.forEach(d => categoriasLista.push({ id: d.id, ...d.data() }));

        const selectCat = document.getElementById('prod-category');
        selectCat.innerHTML = '<option value="">Seleccionar...</option>';
        const principales = [...new Set(categoriasLista.map(c => c.nombre))];
        principales.forEach(cat => selectCat.innerHTML += `<option value="${cat}">${cat}</option>`);
      } catch (e) { console.error(e); }
    }

    window.actualizarSubcategoriasUI = () => {
      const cat = document.getElementById('prod-category').value;
      const selectSub = document.getElementById('prod-subcategory');
      if (!cat) { selectSub.disabled = true; return; }
      selectSub.innerHTML = '<option value="">Seleccionar Subcategoría...</option>';
      categoriasLista.filter(c => c.nombre === cat).forEach(c => selectSub.innerHTML += `<option value="${c.subcategoria}">${c.subcategoria}</option>`);
      selectSub.disabled = false;
    };

    function generarCategoriasUI() {
      const container = document.getElementById('categories-container');
      const categoriasUnicas = ["Todas", ...new Set(productosData.map(p => p.categoria).filter(Boolean))];
      container.innerHTML = "";
      categoriasUnicas.forEach(cat => {
        container.innerHTML += `<button class="btn-cat ${cat === catSeleccionada ? 'active' : ''}" onclick="filtrarCat('${cat}')">${cat}</button>`;
      });
      generarSubcategoriasUI();
    }

    window.filtrarCat = (cat) => { catSeleccionada = cat; subcatSeleccionada = "Todas"; generarCategoriasUI(); renderizarProductos(); };
    window.filtrarSub = (sub) => { subcatSeleccionada = sub; generarSubcategoriasUI(); renderizarProductos(); };

    function generarSubcategoriasUI() {
      const wrapper = document.getElementById('subcategories-wrapper');
      const container = document.getElementById('subcategories-container');
      if (catSeleccionada === "Todas") { wrapper.classList.add('hidden'); return; }
      const subcats = ["Todas", ...new Set(productosData.filter(p => p.categoria === catSeleccionada).map(p => p.subcategoria).filter(Boolean))];
      if (subcats.length <= 1) { wrapper.classList.add('hidden'); return; }
      wrapper.classList.remove('hidden');
      container.innerHTML = "";
      subcats.forEach(sub => container.innerHTML += `<button class="btn-subcat ${sub === subcatSeleccionada ? 'active' : ''}" onclick="filtrarSub('${sub}')">${sub}</button>`);
    }

    // RENDERIZADO DE TARJETAS TIPO FRAVEGA
    function renderizarProductos() {
      const contenedor = document.getElementById('grid-productos');
      contenedor.innerHTML = "";
      let filtrados = productosData;
      if (catSeleccionada !== "Todas") filtrados = filtrados.filter(p => p.categoria === catSeleccionada);
      if (subcatSeleccionada !== "Todas") filtrados = filtrados.filter(p => p.subcategoria === subcatSeleccionada);

      if (filtrados.length === 0) { contenedor.innerHTML = `<p style="color: #94a3b8; grid-column: 1/-1; text-align:center;">No hay productos guardados.</p>`; return; }

      filtrados.forEach(prod => {
        const imagenUrl = prod.imagenes && prod.imagenes[0] ? prod.imagenes[0] : 'https://via.placeholder.com/200?text=Sin+Imagen';
        contenedor.innerHTML += `
          <div class="card">
            <div>
              <div class="card-img-container">
                <img src="${imagenUrl}" alt="${prod.nombre}" onerror="this.src='https://via.placeholder.com/200?text=Error+Imagen'">
              </div>
              <h3>${prod.nombre}</h3>
              <p class="precio">$${prod.precio.toLocaleString('es-AR')}</p>
            </div>
            <div class="card-actions">
              <button class="btn-edit" onclick="prepararEdicion('${prod.id}')"><i class="fa-solid fa-pen"></i> Editar</button>
              <button class="btn-delete" onclick="eliminarProducto('${prod.id}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      });
    }

    // EDICIÓN / ELIMINACIÓN
    window.prepararEdicion = (id) => {
      const prod = productosData.find(p => p.id === id);
      document.getElementById('edit-id').value = prod.id;
      document.getElementById('prod-title').value = prod.nombre;
      document.getElementById('prod-category').value = prod.categoria || '';
      actualizarSubcategoriasUI();
      document.getElementById('prod-subcategory').value = prod.subcategoria || '';
      document.getElementById('prod-price').value = prod.precio;
      document.getElementById('prod-desc').value = prod.descripcion;
      for (let i = 1; i <= 5; i++) document.getElementById(`prod-img-${i}`).value = prod.imagenes[i - 1] || '';
      
      document.getElementById('form-title').innerText = "Modificar Producto";
      abrirModal('modal-producto');
    };

    window.eliminarProducto = async (id) => {
      if (confirm("¿Estás seguro de eliminar este producto?")) {
        await deleteDoc(doc(db, "productos", id));
        cargarTodo();
      }
    };

    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editId = document.getElementById('edit-id').value;
      const imagenes = [];
      for (let i = 1; i <= 5; i++) {
        const url = document.getElementById(`prod-img-${i}`).value.trim();
        if (url) imagenes.push(url);
      }
      const datosProducto = {
        nombre: document.getElementById('prod-title').value,
        categoria: document.getElementById('prod-category').value,
        subcategoria: document.getElementById('prod-subcategory').value,
        precio: Number(document.getElementById('prod-price').value),
        descripcion: document.getElementById('prod-desc').value,
        imagenes: imagenes,
        imagen: imagenes[0] || ''
      };
      
      if (editId) await updateDoc(doc(db, "productos", editId), datosProducto);
      else await addDoc(collection(db, "productos"), { ...datosProducto, fecha: new Date() });
      
      cerrarModal('modal-producto');
      cargarTodo();
    });

    document.getElementById('cat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await addDoc(collection(db, "categorias"), {
        nombre: document.getElementById('new-cat-name').value.trim(),
        subcategoria: document.getElementById('new-subcat-name').value.trim()
      });
      cerrarModal('modal-categoria');
      document.getElementById('cat-form').reset();
      cargarTodo();
    });
  </script>
</body>
