<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peque Elektro - Panel Administrador</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <header class="banner-header">
    <img src="logo.jpg" alt="Peque Elektro" class="banner-img">
  </header>

  <main class="main-container">
    <h1 style="color: #38bdf8; text-align: center; margin-bottom: 30px;">
      <i class="fa-solid fa-user-gear"></i> Panel Administrador
    </h1>

    <!-- SECCIÓN 1: CONFIGURACIÓN DE ENVÍOS -->
    <section class="add-review-box" style="margin-bottom: 40px;">
      <h3><i class="fa-solid fa-truck-fast"></i> Configuración de Envíos y Entregas</h3>
      <form id="form-envios">
        <div style="display: flex; flex-direction: column; gap: 15px;">
          <div>
            <label style="color: #38bdf8; font-weight: bold; font-size: 14px;">Puntos de Encuentro sin costo:</label>
            <input type="text" id="envio-puntos" placeholder="Ej: San Justo, Ramos Mejía..." required style="width: 100%; margin-top: 5px;">
          </div>
          <div>
            <label style="color: #38bdf8; font-weight: bold; font-size: 14px;">Envíos por Correo:</label>
            <input type="text" id="envio-correo" placeholder="Ej: Correo Argentino a todo el país..." required style="width: 100%; margin-top: 5px;">
          </div>
          <div>
            <label style="color: #38bdf8; font-weight: bold; font-size: 14px;">Condición de entrega:</label>
            <input type="text" id="envio-condicion" placeholder="Ej: Pagos contra entrega o transferencia previa..." required style="width: 100%; margin-top: 5px;">
          </div>
          <button type="submit" class="btn-submit-review" style="background: #22c55e;"><i class="fa-solid fa-floppy-disk"></i> Guardar Configuración de Envíos</button>
        </div>
      </form>
    </section>

    <!-- SECCIÓN 2: CARGAR / EDITAR PRODUCTO -->
    <section class="add-review-box" style="margin-bottom: 40px;">
      <h3 id="form-titulo"><i class="fa-solid fa-plus-circle"></i> Agregar Nuevo Producto</h3>
      <form id="form-producto">
        <input type="hidden" id="prod-id">
        
        <div class="review-inputs">
          <input type="text" id="prod-nombre" placeholder="Nombre del producto *" required>
          <input type="number" step="0.01" id="prod-precio" placeholder="Precio ($) *" required>
          <input type="text" id="prod-categoria" placeholder="Categoría (Ej: Hogar, Tecnología) *" required>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="color: #38bdf8; font-size: 14px; font-weight: bold;">URLs de Imágenes (separadas por coma):</label>
          <input type="text" id="prod-imagenes" placeholder="https://img1.jpg, https://img2.jpg" style="width: 100%; margin-top: 5px;" required>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="color: #38bdf8; font-size: 14px; font-weight: bold;">Colores Disponibles (separados por coma, opcional):</label>
          <input type="text" id="prod-colores" placeholder="Rojo, Negro, Azul" style="width: 100%; margin-top: 5px;">
        </div>

        <textarea id="prod-descripcion" placeholder="Descripción detallada del producto..."></textarea>

        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn-submit-review"><i class="fa-solid fa-save"></i> Guardar Producto</button>
          <button type="button" id="btn-cancelar-edit" class="btn-submit-review" style="background: #64748b; display: none;">Cancelar Edición</button>
        </div>
      </form>
    </section>

    <!-- SECCIÓN 3: LISTADO DE PRODUCTOS EXISTENTES -->
    <section>
      <h2 class="section-title">Productos en Catálogo</h2>
      <div id="grid-admin-productos" class="products-grid">
        <p style="text-align:center; color: #94a3b8; grid-column: 1/-1;">Cargando productos...</p>
      </div>
    </section>

    <!-- SECCIÓN 4: PEDIDOS REGISTRADOS -->
    <section style="margin-top: 50px;">
      <h2 class="section-title"><i class="fa-solid fa-receipt"></i> Registro de Pedidos</h2>
      <div id="lista-pedidos" style="display: flex; flex-direction: column; gap: 15px;">
        <p style="text-align:center; color: #94a3b8;">Cargando pedidos...</p>
      </div>
    </section>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, getDoc, setDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTtYfbeNy7z15Pj3Suli68mVGioMFU21E",
      authDomain: "peque-elektro.firebaseapp.com",
      projectId: "peque-elektro",
      storageBucket: "peque-elektro.firebasestorage.app",
      messagingSenderId: "873169424486",
      appId: "1:873169424486:web:e9f77cb2052aa06b3b9da7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let productos = [];

    // 1. CARGAR CONFIGURACIÓN DE ENVÍOS
    async function cargarConfigEnvios() {
      try {
        const docSnap = await getDoc(doc(db, "configuracion", "envios"));
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById("envio-puntos").value = data.puntos || "";
          document.getElementById("envio-correo").value = data.correo || "";
          document.getElementById("envio-condicion").value = data.condicion || "";
        }
      } catch (err) {
        console.error("Error al cargar envíos:", err);
      }
    }

    document.getElementById("form-envios").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await setDoc(doc(db, "configuracion", "envios"), {
          puntos: document.getElementById("envio-puntos").value.trim(),
          correo: document.getElementById("envio-correo").value.trim(),
          condicion: document.getElementById("envio-condicion").value.trim()
        });
        alert("✅ Configuración de envíos actualizada correctamente.");
      } catch (err) {
        alert("⚠️ Error al guardar configuración: " + err.message);
      }
    });

    // 2. CARGAR Y GESTIONAR PRODUCTOS
    async function cargarProductos() {
      const grid = document.getElementById("grid-admin-productos");
      const snap = await getDocs(collection(db, "productos"));
      productos = [];
      snap.forEach(d => productos.push({ id: d.id, ...d.data() }));

      if (productos.length === 0) {
        grid.innerHTML = '<p style="text-align:center; color:#94a3b8; grid-column:1/-1;">No hay productos cargados.</p>';
        return;
      }

      grid.innerHTML = productos.map(p => {
        const img = (p.imagenes && p.imagenes[0]) || p.imagen || 'https://via.placeholder.com/200';
        return `
          <div class="product-card">
            <img src="${img}" alt="${p.nombre}">
            <h3>${p.nombre}</h3>
            <p class="price">$${parseFloat(p.precio || 0).toLocaleString('es-AR')}</p>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
              <button onclick="editarProducto('${p.id}')" style="background:#0284c7; color:white; border:none; padding:8px; border-radius:6px; flex:1; cursor:pointer;">Editar</button>
              <button onclick="eliminarProducto('${p.id}')" style="background:#ef4444; color:white; border:none; padding:8px; border-radius:6px; flex:1; cursor:pointer;">Eliminar</button>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById("form-producto").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("prod-id").value;
      const nombre = document.getElementById("prod-nombre").value.trim();
      const precio = parseFloat(document.getElementById("prod-precio").value);
      const categoria = document.getElementById("prod-categoria").value.trim();
      const descripcion = document.getElementById("prod-descripcion").value.trim();
      const imagenesRaw = document.getElementById("prod-imagenes").value.split(",").map(i => i.trim()).filter(Boolean);
      const coloresRaw = document.getElementById("prod-colores").value.split(",").map(c => c.trim()).filter(Boolean);

      const data = { nombre, precio, categoria, descripcion, imagenes: imagenesRaw, colores: coloresRaw };

      try {
        if (id) {
          await updateDoc(doc(db, "productos", id), data);
          alert("✅ Producto actualizado con éxito.");
        } else {
          await addDoc(collection(db, "productos"), data);
          alert("✅ Producto agregado con éxito.");
        }
        resetForm();
        cargarProductos();
      } catch (err) {
        alert("⚠️ Error al guardar producto: " + err.message);
      }
    });

    window.editarProducto = (id) => {
      const p = productos.find(item => item.id === id);
      if (!p) return;

      document.getElementById("prod-id").value = p.id;
      document.getElementById("prod-nombre").value = p.nombre;
      document.getElementById("prod-precio").value = p.precio;
      document.getElementById("prod-categoria").value = p.categoria;
      document.getElementById("prod-descripcion").value = p.descripcion || "";
      document.getElementById("prod-imagenes").value = (p.imagenes || [p.imagen]).join(", ");
      document.getElementById("prod-colores").value = (p.colores || []).join(", ");

      document.getElementById("form-titulo").innerHTML = '<i class="fa-solid fa-pen"></i> Editar Producto';
      document.getElementById("btn-cancelar-edit").style.display = "block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.eliminarProducto = async (id) => {
      if (confirm("¿Estás seguro de que deseas eliminar este producto?")) {
        try {
          await deleteDoc(doc(db, "productos", id));
          alert("🗑️ Producto eliminado.");
          cargarProductos();
        } catch (err) {
          alert("Error al eliminar: " + err.message);
        }
      }
    };

    document.getElementById("btn-cancelar-edit").onclick = resetForm;

    function resetForm() {
      document.getElementById("form-producto").reset();
      document.getElementById("prod-id").value = "";
      document.getElementById("form-titulo").innerHTML = '<i class="fa-solid fa-plus-circle"></i> Agregar Nuevo Producto';
      document.getElementById("btn-cancelar-edit").style.display = "none";
    }

    // 3. CARGAR PEDIDOS REGISTRADOS
    async function cargarPedidos() {
      const contenedor = document.getElementById("lista-pedidos");
      try {
        const q = query(collection(db, "pedidos"), orderBy("timestamp", "desc"));
        const snap = await getDocs(q);

        if (snap.empty) {
          contenedor.innerHTML = '<p style="text-align:center; color:#94a3b8;">No hay pedidos registrados.</p>';
          return;
        }

        let html = "";
        snap.forEach(d => {
          const ped = d.data();
          let itemsList = (ped.items || []).map(i => `<li>${i.nombre} x${i.cantidad} - $${(i.precio * i.cantidad).toLocaleString('es-AR')}</li>`).join('');
          
          html += `
            <div style="background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 10px;">
              <div style="display: flex; justify-content: space-between; color: #38bdf8; font-weight: bold; margin-bottom: 8px;">
                <span>${ped.orden || 'Pedido'}</span>
                <span style="color: #cbd5e1; font-size: 13px;">${ped.fecha}</span>
              </div>
              <ul style="margin: 0; padding-left: 20px; color: #f8fafc; font-size: 14px;">${itemsList}</ul>
              <div style="text-align: right; color: #22c55e; font-weight: bold; font-size: 16px; margin-top: 10px;">
                Total: $${parseFloat(ped.total || 0).toLocaleString('es-AR')}
              </div>
            </div>
          `;
        });
        contenedor.innerHTML = html;
      } catch (err) {
        console.error("Error al cargar pedidos:", err);
      }
    }

    cargarConfigEnvios();
    cargarProductos();
    cargarPedidos();
  </script>
</body>
</html>
