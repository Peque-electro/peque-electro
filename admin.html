<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peque Elektro - Catálogo de Productos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <!-- BANNER DEL LOGO A TODO LO ANCHO -->
  <header class="banner-header">
    <img src="logo.jpeg" alt="Peque Elektro Logo" class="banner-img" onerror="this.onerror=null; this.src='logo.jpg';">
  </header>

  <main class="container">
    
    <!-- BARRA DE BÚSQUEDA -->
    <div class="search-bar-container">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="search-input" placeholder="Buscar productos por nombre..." oninput="filtrarPorBusqueda()">
      </div>
    </div>

    <!-- FILTROS POR CATEGORÍA -->
    <div id="categories-container" class="categories-bar"></div>
    
    <!-- FILTROS POR SUBCATEGORÍA -->
    <div id="subcategories-wrapper" class="subcategories-container hidden">
      <div id="subcategories-container" class="subcategories-bar"></div>
    </div>

    <h2 class="section-title">Nuestros Productos</h2>

    <!-- GRILLA DE PRODUCTOS -->
    <div id="grid-productos" class="grid-productos"></div>

    <!-- SECCIÓN TU PEDIDO -->
    <section class="checkout-section">
      <div class="checkout-card">
        <h2 class="checkout-title"><i class="fa-solid fa-cart-shopping"></i> Tu Pedido</h2>
        
        <div id="carrito-lista" class="carrito-lista">
          <p class="carrito-vacio-msg">Aún no has agregado productos a tu lista.</p>
        </div>

        <div class="carrito-total-container">
          <span>Total Estimado: <strong id="carrito-total-monto">$0.00</strong></span>
        </div>

        <button id="btn-whatsapp-pedido" class="btn-whatsapp-giant" onclick="enviarPedidoFirebaseYWhatsapp()" disabled>
          <i class="fa-brands fa-whatsapp"></i> Finalizar y Enviar Pedido
        </button>
      </div>
    </section>

  </main>

  <footer>
    <p>&copy; Peque Elektro - Todos los derechos reservados</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTtYfbeNy7z15Pj3Suli68mVGioMFU21E",
      authDomain: "peque-elektro.firebaseapp.com",
      projectId: "peque-elektro",
      storageBucket: "peque-elektro.firebasestorage.app",
      messagingSenderId: "873169424486",
      appId: "1:873169424486:web:e9f77cb2052aa06b3b9da7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let productosData = [];
    let carrito = [];
    let catSeleccionada = "Todas";
    let subcatSeleccionada = "Todas";
    let textoBusqueda = "";

    async function cargarProductos() {
      try {
        const snap = await getDocs(collection(db, "productos"));
        productosData = [];
        snap.forEach(doc => {
          const prod = doc.data();
          const imagenes = prod.imagenes && prod.imagenes.length > 0 ? prod.imagenes : [prod.imagen || 'https://via.placeholder.com/300'];
          productosData.push({ id: doc.id, ...prod, imagenes });
        });
        generarCategoriasUI();
        renderizarProductos();
        renderizarCarrito();
      } catch (e) {
        console.error("Error al cargar productos:", e);
      }
    }

    function generarCategoriasUI() {
      const container = document.getElementById('categories-container');
      const categoriasUnicas = ["Todas", ...new Set(productosData.map(p => p.categoria).filter(Boolean))];
      container.innerHTML = "";
      categoriasUnicas.forEach(cat => {
        container.innerHTML += `<button class="btn-cat ${cat === catSeleccionada ? 'active' : ''}" onclick="filtrarCat('${cat}')">${cat}</button>`;
      });
      generarSubcategoriasUI();
    }

    window.filtrarCat = (cat) => {
      catSeleccionada = cat;
      subcatSeleccionada = "Todas";
      generarCategoriasUI();
      renderizarProductos();
    };

    window.filtrarSub = (sub) => {
      subcatSeleccionada = sub;
      generarSubcategoriasUI();
      renderizarProductos();
    };

    window.filtrarPorBusqueda = () => {
      textoBusqueda = document.getElementById('search-input').value.toLowerCase().trim();
      renderizarProductos();
    };

    function generarSubcategoriasUI() {
      const wrapper = document.getElementById('subcategories-wrapper');
      const container = document.getElementById('subcategories-container');
      if (catSeleccionada === "Todas") {
        wrapper.classList.add('hidden');
        return;
      }
      const subcats = ["Todas", ...new Set(productosData.filter(p => p.categoria === catSeleccionada).map(p => p.subcategoria).filter(Boolean))];
      if (subcats.length <= 1) {
        wrapper.classList.add('hidden');
        return;
      }
      wrapper.classList.remove('hidden');
      container.innerHTML = "";
      subcats.forEach(sub => {
        container.innerHTML += `<button class="btn-subcat ${sub === subcatSeleccionada ? 'active' : ''}" onclick="filtrarSub('${sub}')">${sub}</button>`;
      });
    }

    function renderizarProductos() {
      const contenedor = document.getElementById('grid-productos');
      contenedor.innerHTML = "";

      let filtrados = productosData;
      if (catSeleccionada !== "Todas") filtrados = filtrados.filter(p => p.categoria === catSeleccionada);
      if (subcatSeleccionada !== "Todas") filtrados = filtrados.filter(p => p.subcategoria === subcatSeleccionada);
      if (textoBusqueda !== "") filtrados = filtrados.filter(p => p.nombre.toLowerCase().includes(textoBusqueda));

      if (filtrados.length === 0) {
        contenedor.innerHTML = `<p style="color: #94a3b8; grid-column: 1/-1; text-align:center; padding: 30px;">No se encontraron productos.</p>`;
        return;
      }

      filtrados.forEach(prod => {
        const imagenUrl = prod.imagenes[0];
        contenedor.innerHTML += `
          <div class="card">
            <div class="card-img-container">
              <img src="${imagenUrl}" alt="${prod.nombre}" onerror="this.src='https://via.placeholder.com/200?text=Sin+Imagen'">
            </div>
            <h3>${prod.nombre}</h3>
            <p class="precio">$${prod.precio.toLocaleString('es-AR')}</p>
            <button class="btn-add-cart" onclick="agregarAlCarrito('${prod.id}')">
              Agregar al carrito
            </button>
          </div>
        `;
      });
    }

    // CARRITO
    window.agregarAlCarrito = (id) => {
      const producto = productosData.find(p => p.id === id);
      if (!producto) return;

      const itemExistente = carrito.find(item => item.id === id);
      if (itemExistente) {
        itemExistente.cantidad++;
      } else {
        carrito.push({
          id: producto.id,
          nombre: producto.nombre,
          precio: producto.precio,
          cantidad: 1,
          imagen: producto.imagenes[0]
        });
      }
      renderizarCarrito();
    };

    window.cambiarCantidad = (id, delta) => {
      const item = carrito.find(i => i.id === id);
      if (!item) return;
      item.cantidad += delta;
      if (item.cantidad <= 0) {
        carrito = carrito.filter(i => i.id !== id);
      }
      renderizarCarrito();
    };

    window.eliminarItemCarrito = (id) => {
      carrito = carrito.filter(i => i.id !== id);
      renderizarCarrito();
    };

    function renderizarCarrito() {
      const contenedor = document.getElementById('carrito-lista');
      const totalMontoElem = document.getElementById('carrito-total-monto');
      const btnWhatsapp = document.getElementById('btn-whatsapp-pedido');

      if (carrito.length === 0) {
        contenedor.innerHTML = `<p class="carrito-vacio-msg">Aún no has agregado productos a tu lista.</p>`;
        totalMontoElem.innerText = "$0.00";
        btnWhatsapp.disabled = true;
        return;
      }

      btnWhatsapp.disabled = false;

      let html = "";
      let total = 0;

      carrito.forEach(item => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        html += `
          <div class="carrito-item" style="display: flex; align-items: center; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.05); margin-bottom: 8px; border-radius: 8px;">
            <div style="flex: 1;">
              <strong>${item.nombre}</strong><br>
              <small>$${item.precio.toLocaleString('es-AR')} c/u</small>
            </div>
            <div style="margin: 0 15px;">
              <button onclick="cambiarCantidad('${item.id}', -1)" style="padding: 2px 8px;">-</button>
              <span style="margin: 0 5px;">${item.cantidad}</span>
              <button onclick="cambiarCantidad('${item.id}', 1)" style="padding: 2px 8px;">+</button>
            </div>
            <div style="font-weight: bold; margin-right: 15px;">$${subtotal.toLocaleString('es-AR')}</div>
            <button onclick="eliminarItemCarrito('${item.id}')" style="background:none; border:none; color:#ef4444; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
      });

      contenedor.innerHTML = html;
      totalMontoElem.innerText = `$${total.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
    }

    // REGISTRO EN FIREBASE Y LUEGO WHATSAPP
    window.enviarPedidoFirebaseYWhatsapp = async () => {
      if (carrito.length === 0) return;

      const btn = document.getElementById('btn-whatsapp-pedido');
      btn.innerText = "Procesando pedido...";
      btn.disabled = true;

      let total = 0;
      const itemsPedido = carrito.map(i => {
        const subtotal = i.precio * i.cantidad;
        total += subtotal;
        return {
          id: i.id,
          nombre: i.nombre,
          precio: i.precio,
          cantidad: i.cantidad,
          subtotal: subtotal
        };
      });

      try {
        // Guardar pedido en Firestore para que el Admin lo vea
        await addDoc(collection(db, "pedidos"), {
          items: itemsPedido,
          total: total,
          estado: "Pendiente",
          fecha: serverTimestamp()
        });
        console.log("Pedido guardado exitosamente en Firebase");
      } catch (e) {
        console.error("Error al registrar pedido en Firestore:", e);
      }

      // Redirigir a WhatsApp
      const numeroTel = "5491134970171";
      let mensaje = "Hola *Peque Elektro*, quisiera realizar el siguiente pedido:\n\n";

      itemsPedido.forEach((item, index) => {
        mensaje += `*${index + 1}.* ${item.nombre}\n   - Cantidad: *${item.cantidad}*\n   - Subtotal: *$${item.subtotal.toLocaleString('es-AR')}*\n\n`;
      });

      mensaje += `*TOTAL ESTIMADO: $${total.toLocaleString('es-AR', {minimumFractionDigits: 2})}*\n\n¡Quedo a la espera para coordinar el pago y envío!`;

      // Limpiar carrito y restaurar botón
      carrito = [];
      renderizarCarrito();
      btn.innerHTML = `<i class="fa-brands fa-whatsapp"></i> Finalizar y Enviar Pedido`;

      const urlWhatsApp = `https://wa.me/${numeroTel}?text=${encodeURIComponent(mensaje)}`;
      window.open(urlWhatsApp, '_blank');
    };

    cargarProductos();
  </script>

</body>
</html>
