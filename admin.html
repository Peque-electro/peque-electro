<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peque Elektro - Panel Administrador</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <header class="banner-header">
    <img src="logo.jpg" alt="Peque Elektro" class="banner-img">
  </header>

  <main class="main-container">
    <h1 style="color: #38bdf8; text-align: center; margin-bottom: 30px;">
      <i class="fa-solid fa-user-gear"></i> Panel Administrador
    </h1>

    <!-- 1. EDICIÓN DEL ESLOGAN Y PRESENTACIÓN -->
    <section class="add-review-box" style="margin-bottom: 30px;">
      <h3><i class="fa-solid fa-bullhorn"></i> Editar Texto de Presentación (Eslogan)</h3>
      <form id="form-slogan">
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div>
            <label style="color: #38bdf8; font-size: 13px; font-weight: bold;">Título Principal:</label>
            <input type="text" id="slogan-titulo" placeholder="Ej: Peque Elektro: Tu solución integral." required style="width: 100%;">
          </div>
          <div>
            <label style="color: #38bdf8; font-size: 13px; font-weight: bold;">Bajada / Introducción:</label>
            <input type="text" id="slogan-intro" placeholder="Ej: Simplificamos tu búsqueda..." required style="width: 100%;">
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px;">
            <div>
              <label style="color: #cbd5e1; font-size: 12px;">Item 1 (Hogar/Bazar):</label>
              <input type="text" id="slogan-item1" style="width: 100%;">
            </div>
            <div>
              <label style="color: #cbd5e1; font-size: 12px;">Item 2 (Tecnología):</label>
              <input type="text" id="slogan-item2" style="width: 100%;">
            </div>
            <div>
              <label style="color: #cbd5e1; font-size: 12px;">Item 3 (Herramientas):</label>
              <input type="text" id="slogan-item3" style="width: 100%;">
            </div>
          </div>
          <div>
            <label style="color: #38bdf8; font-size: 13px; font-weight: bold;">Texto del Badge / Botón Inferior:</label>
            <input type="text" id="slogan-badge" style="width: 100%;">
          </div>
          <button type="submit" class="btn-submit-review" style="background: #0284c7;"><i class="fa-solid fa-floppy-disk"></i> Guardar Presentación</button>
        </div>
      </form>
    </section>

    <!-- 2. CONFIGURACIÓN DE ENVÍOS -->
    <section class="add-review-box" style="margin-bottom: 30px;">
      <h3><i class="fa-solid fa-truck-fast"></i> Configuración de Envíos y Entregas</h3>
      <form id="form-envios">
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div>
            <label style="color: #38bdf8; font-weight: bold; font-size: 13px;">Puntos de Encuentro sin costo:</label>
            <input type="text" id="envio-puntos" required style="width: 100%;">
          </div>
          <div>
            <label style="color: #38bdf8; font-weight: bold; font-size: 13px;">Envíos por Correo:</label>
            <input type="text" id="envio-correo" required style="width: 100%;">
          </div>
          <div>
            <label style="color: #38bdf8; font-weight: bold; font-size: 13px;">Condición de entrega:</label>
            <input type="text" id="envio-condicion" required style="width: 100%;">
          </div>
          <button type="submit" class="btn-submit-review" style="background: #22c55e;"><i class="fa-solid fa-floppy-disk"></i> Guardar Envíos</button>
        </div>
      </form>
    </section>

    <!-- 3. FORMULARIO DE PRODUCTOS COMPLETO -->
    <section class="add-review-box" style="margin-bottom: 40px;">
      <h3 id="form-titulo"><i class="fa-solid fa-plus-circle"></i> Cargar / Editar Producto</h3>
      <form id="form-producto">
        <input type="hidden" id="prod-id">
        
        <div class="review-inputs">
          <input type="text" id="prod-nombre" placeholder="Nombre del producto *" required>
          <input type="number" step="0.01" id="prod-precio" placeholder="Precio ($) *" required>
          <input type="text" id="prod-categoria" placeholder="Categoría Principal *" required>
          <input type="text" id="prod-subcategoria" placeholder="Subcategoría (Opcional)">
        </div>

        <div style="margin-bottom: 15px;">
          <label style="color: #38bdf8; font-size: 13px; font-weight: bold; display: block; margin-bottom: 6px;">URLs de Imágenes (Hasta 4 imágenes):</label>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px;">
            <input type="text" id="prod-img1" placeholder="Imagen Principal (URL) *" required>
            <input type="text" id="prod-img2" placeholder="Imagen 2 (Opcional)">
            <input type="text" id="prod-img3" placeholder="Imagen 3 (Opcional)">
            <input type="text" id="prod-img4" placeholder="Imagen 4 (Opcional)">
          </div>
        </div>

        <div style="margin-bottom: 15px;">
          <label style="color: #38bdf8; font-size: 13px; font-weight: bold;">Colores Disponibles (Separados por coma):</label>
          <input type="text" id="prod-colores" placeholder="Ej: Azul, Rosa, Negro" style="width: 100%; margin-top: 4px;">
        </div>

        <div style="margin-bottom: 15px;">
          <label style="color: #38bdf8; font-size: 13px; font-weight: bold;">Descripción Completa y Ficha Técnica:</label>
          <textarea id="prod-descripcion" placeholder="Escribe aquí las especificaciones técnicas..." style="height: 180px; width: 100%; margin-top: 4px; font-family: monospace;"></textarea>
        </div>

        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn-submit-review"><i class="fa-solid fa-save"></i> Guardar Producto</button>
          <button type="button" id="btn-cancelar-edit" class="btn-submit-review" style="background: #64748b; display: none;">Cancelar Edición</button>
        </div>
      </form>
    </section>

    <!-- 4. REGISTRO Y GESTIÓN DE PEDIDOS/ÓRDENES -->
    <section style="margin-bottom: 50px;">
      <h2 class="section-title"><i class="fa-solid fa-boxes-packing"></i> Gestión de Órdenes de Trabajo</h2>
      <div id="lista-pedidos" style="display: flex; flex-direction: column; gap: 20px;">
        <p style="text-align:center; color: #94a3b8;">Cargando órdenes...</p>
      </div>
    </section>

    <!-- 5. CATÁLOGO ADMIN CON BUSCADOR -->
    <section>
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
        <h2 class="section-title" style="margin-bottom: 0;"><i class="fa-solid fa-list"></i> Productos en Catálogo</h2>
        
        <!-- BUSCADOR ADMIN -->
        <div style="position: relative; min-width: 280px;">
          <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
          <input type="text" id="buscar-admin" placeholder="Buscar producto por nombre..." style="padding: 10px 10px 10px 38px; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: white; width: 100%; box-sizing: border-box;">
        </div>
      </div>

      <div id="grid-admin-productos" class="products-grid">
        <p style="text-align:center; color: #94a3b8; grid-column: 1/-1;">Cargando productos...</p>
      </div>
    </section>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, getDoc, setDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTtYfbeNy7z15Pj3Suli68mVGioMFU21E",
      authDomain: "peque-elektro.firebaseapp.com",
      projectId: "peque-elektro",
      storageBucket: "peque-elektro.firebasestorage.app",
      messagingSenderId: "873169424486",
      appId: "1:873169424486:web:e9f77cb2052aa06b3b9da7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let productos = [];
    let pedidosGlobales = [];

    // 1. CARGAR Y GUARDAR ESLOGAN
    async function cargarSlogan() {
      try {
        const snap = await getDoc(doc(db, "configuracion", "slogan"));
        if (snap.exists()) {
          const d = snap.data();
          document.getElementById("slogan-titulo").value = d.titulo || "";
          document.getElementById("slogan-intro").value = d.intro || "";
          document.getElementById("slogan-item1").value = d.item1 || "";
          document.getElementById("slogan-item2").value = d.item2 || "";
          document.getElementById("slogan-item3").value = d.item3 || "";
          document.getElementById("slogan-badge").value = d.badge || "";
        }
      } catch(e) { console.error(e); }
    }

    document.getElementById("form-slogan").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await setDoc(doc(db, "configuracion", "slogan"), {
          titulo: document.getElementById("slogan-titulo").value.trim(),
          intro: document.getElementById("slogan-intro").value.trim(),
          item1: document.getElementById("slogan-item1").value.trim(),
          item2: document.getElementById("slogan-item2").value.trim(),
          item3: document.getElementById("slogan-item3").value.trim(),
          badge: document.getElementById("slogan-badge").value.trim()
        });
        alert("✅ Presentación guardada correctamente. Se actualizará en la página principal.");
      } catch(err) { alert("Error: " + err.message); }
    });

    // 2. CARGAR Y GUARDAR ENVÍOS
    async function cargarConfigEnvios() {
      try {
        const snap = await getDoc(doc(db, "configuracion", "envios"));
        if (snap.exists()) {
          const d = snap.data();
          document.getElementById("envio-puntos").value = d.puntos || "";
          document.getElementById("envio-correo").value = d.correo || "";
          document.getElementById("envio-condicion").value = d.condicion || "";
        }
      } catch (err) { console.error(err); }
    }

    document.getElementById("form-envios").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await setDoc(doc(db, "configuracion", "envios"), {
          puntos: document.getElementById("envio-puntos").value.trim(),
          correo: document.getElementById("envio-correo").value.trim(),
          condicion: document.getElementById("envio-condicion").value.trim()
        });
        alert("✅ Envíos guardados.");
      } catch (err) { alert("Error: " + err.message); }
    });

    // 3. PRODUCTOS Y BUSCADOR ADMIN
    async function cargarProductos() {
      const snap = await getDocs(collection(db, "productos"));
      productos = [];
      snap.forEach(d => productos.push({ id: d.id, ...d.data() }));
      renderProductosAdmin(productos);
    }

    function renderProductosAdmin(lista) {
      const grid = document.getElementById("grid-admin-productos");

      if (lista.length === 0) {
        grid.innerHTML = '<p style="text-align:center; color:#94a3b8; grid-column:1/-1;">No se encontraron productos.</p>';
        return;
      }

      grid.innerHTML = lista.map(p => {
        const img = (p.imagenes && p.imagenes[0]) || p.imagen || 'https://via.placeholder.com/200';
        return `
          <div class="product-card">
            <img src="${img}" alt="${p.nombre}">
            <h3>${p.nombre}</h3>
            <p class="price">$${parseFloat(p.precio || 0).toLocaleString('es-AR')}</p>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
              <button onclick="editarProducto('${p.id}')" style="background:#0284c7; color:white; border:none; padding:8px; border-radius:6px; flex:1; cursor:pointer;">Editar</button>
              <button onclick="eliminarProducto('${p.id}')" style="background:#ef4444; color:white; border:none; padding:8px; border-radius:6px; flex:1; cursor:pointer;">Eliminar</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // EVENTO BUSCADOR ADMIN
    document.getElementById("buscar-admin").addEventListener("input", (e) => {
      const termino = e.target.value.toLowerCase().trim();
      const filtrados = productos.filter(p => p.nombre.toLowerCase().includes(termino));
      renderProductosAdmin(filtrados);
    });

    // FORMULARIO PRODUCTO
    document.getElementById("form-producto").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("prod-id").value;
      const nombre = document.getElementById("prod-nombre").value.trim();
      const precio = parseFloat(document.getElementById("prod-precio").value);
      const categoria = document.getElementById("prod-categoria").value.trim();
      const subcategoria = document.getElementById("prod-subcategoria").value.trim();
      const descripcion = document.getElementById("prod-descripcion").value.trim();
      const colores = document.getElementById("prod-colores").value.split(",").map(c => c.trim()).filter(Boolean);

      const imgs = [
        document.getElementById("prod-img1").value.trim(),
        document.getElementById("prod-img2").value.trim(),
        document.getElementById("prod-img3").value.trim(),
        document.getElementById("prod-img4").value.trim()
      ].filter(Boolean);

      const data = { nombre, precio, categoria, subcategoria, descripcion, imagenes: imgs, colores };

      try {
        if (id) {
          await updateDoc(doc(db, "productos", id), data);
          alert("✅ Producto actualizado.");
        } else {
          await addDoc(collection(db, "productos"), data);
          alert("✅ Producto agregado.");
        }
        resetForm();
        cargarProductos();
      } catch (err) { alert("Error: " + err.message); }
    });

    window.editarProducto = (id) => {
      const p = productos.find(item => item.id === id);
      if (!p) return;

      document.getElementById("prod-id").value = p.id;
      document.getElementById("prod-nombre").value = p.nombre;
      document.getElementById("prod-precio").value = p.precio;
      document.getElementById("prod-categoria").value = p.categoria || "";
      document.getElementById("prod-subcategoria").value = p.subcategoria || "";
      document.getElementById("prod-descripcion").value = p.descripcion || "";
      document.getElementById("prod-colores").value = (p.colores || []).join(", ");

      const imgs = p.imagenes || [p.imagen];
      document.getElementById("prod-img1").value = imgs[0] || "";
      document.getElementById("prod-img2").value = imgs[1] || "";
      document.getElementById("prod-img3").value = imgs[2] || "";
      document.getElementById("prod-img4").value = imgs[3] || "";

      document.getElementById("form-titulo").innerHTML = '<i class="fa-solid fa-pen"></i> Editar Producto';
      document.getElementById("btn-cancelar-edit").style.display = "block";
      window.scrollTo({ top: 400, behavior: 'smooth' });
    };

    window.eliminarProducto = async (id) => {
      if (confirm("¿Eliminar este producto?")) {
        await deleteDoc(doc(db, "productos", id));
        cargarProductos();
      }
    };

    document.getElementById("btn-cancelar-edit").onclick = resetForm;

    function resetForm() {
      document.getElementById("form-producto").reset();
      document.getElementById("prod-id").value = "";
      document.getElementById("form-titulo").innerHTML = '<i class="fa-solid fa-plus-circle"></i> Cargar / Editar Producto';
      document.getElementById("btn-cancelar-edit").style.display = "none";
    }

    // 4. GESTIÓN DE PEDIDOS Y AGREGAR DESDE LISTA DESPLEGABLE
    async function cargarPedidos() {
      const contenedor = document.getElementById("lista-pedidos");
      try {
        const q = query(collection(db, "pedidos"), orderBy("timestamp", "desc"));
        const snap = await getDocs(q);

        if (snap.empty) {
          contenedor.innerHTML = '<p style="text-align:center; color:#94a3b8;">No hay órdenes registradas.</p>';
          return;
        }

        pedidosGlobales = [];
        let html = "";
        
        snap.forEach(d => {
          const ped = { id: d.id, ...d.data() };
          pedidosGlobales.push(ped);

          const estadoActual = ped.estado || "Pendiente";
          
          let itemsList = (ped.items || []).map((item, idx) => `
            <li style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px; background:#0f172a; padding:6px 10px; border-radius:6px;">
              <span><strong>${item.nombre}</strong> x${item.cantidad} - $${(item.precio * item.cantidad).toLocaleString('es-AR')}</span>
              <button onclick="eliminarItemOrden('${ped.id}', ${idx})" style="background:#ef4444; color:white; border:none; padding:3px 8px; border-radius:4px; cursor:pointer; font-size:12px;">Quitar</button>
            </li>
          `).join('');

          // Generar Opciones de Productos para el Desplegable
          let opcionesProductos = productos.map(p => `<option value="${p.id}">${p.nombre} - $${p.precio}</option>`).join('');

          html += `
            <div style="background: #1e293b; border: 1px solid #334155; padding: 18px; border-radius: 12px;">
              <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 12px; flex-wrap: wrap; gap:10px;">
                <span style="color: #38bdf8; font-weight: bold; font-size: 16px;">${ped.orden || 'Orden de trabajo'}</span>
                <span style="color: #cbd5e1; font-size: 13px;">${ped.fecha || ''}</span>
                
                <div style="display:flex; align-items:center; gap:8px;">
                  <label style="font-size:12px; color:#cbd5e1;">Estado:</label>
                  <select onchange="cambiarEstadoOrden('${ped.id}', this.value)" style="background:#0f172a; color:#38bdf8; border:1px solid #334155; padding:5px 10px; border-radius:6px; font-weight:bold;">
                    <option value="Pendiente" ${estadoActual === 'Pendiente' ? 'selected' : ''}>⏳ Pendiente</option>
                    <option value="En Proceso" ${estadoActual === 'En Proceso' ? 'selected' : ''}>⚙️ En Proceso</option>
                    <option value="Enviado" ${estadoActual === 'Enviado' ? 'selected' : ''}>🚚 Enviado</option>
                    <option value="Terminado" ${estadoActual === 'Terminado' ? 'selected' : ''}>✅ Terminado</option>
                  </select>
                </div>
              </div>

              <ul style="list-style:none; padding:0; margin:0 0 15px 0;">${itemsList}</ul>

              <!-- SELECCIONAR Y AGREGAR PRODUCTO A LA ORDEN DESDE CATÁLOGO -->
              <div style="display:flex; gap:10px; margin-bottom:15px; background:#0f172a; padding:10px; border-radius:8px; align-items:center; flex-wrap:wrap;">
                <select id="select-prod-${ped.id}" style="flex:1; min-width:200px; padding:8px; border-radius:6px; background:#1e293b; color:white; border:1px solid #334155;">
                  <option value="">-- Seleccionar producto para agregar --</option>
                  ${opcionesProductos}
                </select>
                <button onclick="agregarProductoSeleccionado('${ped.id}')" style="background:#22c55e; color:white; border:none; padding:8px 15px; border-radius:6px; font-weight:bold; cursor:pointer;">+ Agregar a Orden</button>
              </div>

              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <div style="color: #22c55e; font-weight: bold; font-size: 18px;">
                  Total: $${parseFloat(ped.total || 0).toLocaleString('es-AR')}
                </div>
                <button onclick="eliminarOrden('${ped.id}')" style="background:#b91c1c; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px;">Eliminar Orden</button>
              </div>
            </div>
          `;
        });

        contenedor.innerHTML = html;
      } catch (err) { console.error(err); }
    }

    // AGREGAR DESDE DESPLEGABLE
    window.agregarProductoSeleccionado = async (pedId) => {
      const select = document.getElementById(`select-prod-${pedId}`);
      const prodId = select.value;
      if (!prodId) {
        alert("Selecciona un producto del catálogo primero.");
        return;
      }

      const prod = productos.find(p => p.id === prodId);
      const ped = pedidosGlobales.find(p => p.id === pedId);

      if (prod && ped) {
        ped.items.push({ nombre: prod.nombre, precio: parseFloat(prod.precio), cantidad: 1 });
        const nuevoTotal = ped.items.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);

        try {
          await updateDoc(doc(db, "pedidos", pedId), { items: ped.items, total: nuevoTotal });
          cargarPedidos();
        } catch(err) { alert("Error al agregar producto: " + err.message); }
      }
    };

    window.cambiarEstadoOrden = async (id, nuevoEstado) => {
      try {
        await updateDoc(doc(db, "pedidos", id), { estado: nuevoEstado });
        alert(`Estado actualizado a: ${nuevoEstado}`);
      } catch(err) { alert("Error al actualizar estado: " + err.message); }
    };

    window.eliminarItemOrden = async (pedId, itemIdx) => {
      const ped = pedidosGlobales.find(p => p.id === pedId);
      if (!ped) return;

      ped.items.splice(itemIdx, 1);
      const nuevoTotal = ped.items.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);

      try {
        await updateDoc(doc(db, "pedidos", pedId), { items: ped.items, total: nuevoTotal });
        cargarPedidos();
      } catch(err) { alert("Error al modificar orden: " + err.message); }
    };

    window.eliminarOrden = async (id) => {
      if (confirm("¿Estás seguro de eliminar toda esta orden?")) {
        await deleteDoc(doc(db, "pedidos", id));
        cargarPedidos();
      }
    };

    cargarSlogan();
    cargarConfigEnvios();
    cargarProductos().then(() => cargarPedidos());
  </script>
</body>
</html>
