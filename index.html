<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peque Elektro - Tu solución integral</title>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* BANNER HEADER */
        .banner-header {
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            background: #020617;
            overflow: hidden;
            border-bottom: 1px solid #1e293b;
        }
        .banner-img {
            width: 100%;
            height: auto;
            max-height: 250px;
            display: block;
            object-fit: cover;
        }

        /* HERO SLOGAN & ENVÍOS */
        .hero-slogan {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-bottom: 1px solid #334155;
            padding: 25px 20px;
        }
        .slogan-container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        .slogan-container h2 {
            color: #38bdf8;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 8px;
        }
        .slogan-intro {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 15px;
        }
        .slogan-badge {
            color: #38bdf8;
            font-weight: bold;
            font-size: 14px;
            background: rgba(56, 189, 248, 0.1);
            padding: 8px 14px;
            border-radius: 8px;
            display: inline-block;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        /* LAYOUT PRINCIPAL DE DOS COLUMNAS (SIDEBAR + CONTENIDO) */
        .shop-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 25px;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        @media (max-width: 768px) {
            .shop-layout {
                grid-template-columns: 1fr;
            }
        }

        /* BARRA LATERAL DE CATEGORÍAS Y SUBCATEGORÍAS */
        .sidebar {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
        }
        .sidebar h3 {
            color: #38bdf8;
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cat-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .cat-item {
            margin-bottom: 10px;
        }
        .cat-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #cbd5e1;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            background: #0f172a;
            border: 1px solid #334155;
        }
        .cat-link:hover, .cat-link.active {
            background: #0284c7;
            color: white;
            border-color: #0284c7;
        }
        .subcat-list {
            list-style: none;
            padding-left: 15px;
            margin: 6px 0 0 0;
            border-left: 2px solid #334155;
        }
        .subcat-item {
            margin-top: 4px;
        }
        .subcat-link {
            display: block;
            color: #94a3b8;
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .subcat-link:hover, .subcat-link.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.08);
        }

        /* CONTENIDO DERECHO (BUSCADOR + PRODUCTOS) */
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .search-wrapper {
            position: relative;
        }
        .search-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        .search-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        .search-wrapper input:focus {
            border-color: #38bdf8;
        }

        .section-title {
            color: #f8fafc;
            font-size: 20px;
            margin: 0 0 15px 0;
            border-left: 4px solid #38bdf8;
            padding-left: 10px;
        }

        /* GRID DE PRODUCTOS */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
        }
        .product-card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #0f172a;
        }
        .product-card h3 {
            font-size: 15px;
            margin: 0 0 8px 0;
            color: #f8fafc;
        }
        .product-card .price {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
            margin: 0 0 12px 0;
        }
        .btn-detail {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-detail:hover {
            background: #0369a1;
        }

        /* MODAL FULLSCREEN */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            z-index: 2000;
        }
        .modal-content-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0f172a;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-sizing: border-box;
        }
        .modal-overlay.active .modal-content-fullscreen {
            transform: translateX(0);
        }
        .fullscreen-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .modal-grid-large {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 25px;
        }
        @media (max-width: 768px) {
            .modal-grid-large {
                grid-template-columns: 1fr;
            }
        }
        .modal-main-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #1e293b;
        }
        .modal-thumbnails {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .modal-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #334155;
            cursor: pointer;
            background: #1e293b;
        }
        .modal-thumb.active {
            border-color: #38bdf8;
        }
        .product-description-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            color: #cbd5e1;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-line;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-size: 14px;
            border-top: 1px solid #1e293b;
            background: #020617;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- BANNER HEADER -->
    <header class="banner-header">
        <img src="banner.jpg" alt="Peque Elektro Banner" class="banner-img" onerror="this.src='https://via.placeholder.com/1200x250/0f172a/38bdf8?text=Peque+Elektro'">
    </header>

    <!-- SLOGAN -->
    <section class="hero-slogan">
        <div class="slogan-container">
            <h2 id="slogan-titulo">Peque Elektro: Tu solución integral.</h2>
            <p id="slogan-intro" class="slogan-intro">Encuentra herramientas, repuestos y componentes de la mejor calidad.</p>
            <div>
                <span id="slogan-badge-elem" class="slogan-badge">¡Envíos a todo el país!</span>
            </div>
        </div>
    </section>

    <!-- LAYOUT PRINCIPAL: SIDEBAR + PRODUCTOS -->
    <div class="shop-layout">
        <!-- BARRA LATERAL DE CATEGORÍAS Y SUBCATEGORÍAS -->
        <aside class="sidebar">
            <h3><i class="fa-solid fa-list"></i> Categorías</h3>
            <ul class="cat-list" id="sidebar-categories">
                <!-- Se cargan dinámicamente o por código -->
                <li><a class="cat-link active" onclick="filtrarCategoria('todos')">Todas las Categorías</a></li>
            </ul>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="content-area">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Buscar productos por nombre...">
            </div>

            <h2 class="section-title" id="current-category-title">Catálogo de Productos</h2>
            
            <div class="products-grid" id="products-grid">
                <!-- Renderizado dinámico desde Firebase -->
            </div>
        </main>
    </div>

    <!-- MODAL DE DETALLE -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-content-fullscreen">
            <div class="fullscreen-container">
                <div style="display: flex; justify-content: flex-end;">
                    <button onclick="cerrarModal()" style="background: #ef4444; color: white; border: none; font-size: 18px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="modal-grid-large">
                    <div>
                        <img id="modal-img" src="" alt="Producto" class="modal-main-img">
                        <div class="modal-thumbnails" id="modal-thumbnails"></div>
                    </div>
                    <div>
                        <h2 id="modal-title" style="color: #f8fafc; margin-top: 0;"></h2>
                        <div id="modal-price" style="font-size: 26px; font-weight: bold; color: #38bdf8; margin-bottom: 20px;"></div>
                        
                        <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 20px;">
                            <button onclick="cambiarCantidad(-1)" style="background: #1e293b; color: white; border: 1px solid #334155; padding: 8px 16px; border-radius: 6px; cursor: pointer;">-</button>
                            <span id="modal-qty" style="font-size: 18px; font-weight: bold; color: white;">1</span>
                            <button onclick="cambiarCantidad(1)" style="background: #1e293b; color: white; border: 1px solid #334155; padding: 8px 16px; border-radius: 6px; cursor: pointer;">+</button>
                        </div>

                        <button style="background: #22c55e; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 16px;">
                            <i class="fa-solid fa-cart-shopping"></i> Agregar al Carrito
                        </button>
                    </div>
                </div>

                <div class="product-description-box">
                    <h3 style="color: #38bdf8; margin-top: 0;">Descripción:</h3>
                    <div id="modal-description">Cargando descripción...</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Peque Elektro - Todos los derechos reservados.</p>
    </footer>

    <!-- FIREBASE & LOGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDTtYfbeNy7z15Pj3Suli68mVGioMFU21E",
            authDomain: "peque-elektro.firebaseapp.com",
            projectId: "peque-elektro",
            storageBucket: "peque-elektro.firebasestorage.app",
            messagingSenderId: "873169424486",
            appId: "1:873169424486:web:e9f77cb2052aa06b3b9da7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let productosGlobal = [];
        let categoriaSeleccionada = "todos";
        let subcategoriaSeleccionada = "";

        async function cargarDatos() {
            try {
                const querySnapshot = await getDocs(collection(db, "productos"));
                productosGlobal = [];
                querySnapshot.forEach((docSnap) => {
                    productosGlobal.push({ id: docSnap.id, ...docSnap.data() });
                });
                generarMenuLateral();
                renderizarProductos(productosGlobal);
            } catch (err) {
                console.error("Error al cargar productos:", err);
            }
        }

        function generarMenuLateral() {
            const sidebarList = document.getElementById("sidebar-categories");
            // Estructurar categorías y subcategorías únicas desde los productos
            const categoriasMap = {};
            productosGlobal.forEach(p => {
                const cat = p.categoria || "Sin categoría";
                const subcat = p.subcategoria || null;
                if (!categoriasMap[cat]) categoriasMap[cat] = new Set();
                if (subcat) categoriasMap[cat].add(subcat);
            });

            let html = `<li><a class="cat-link ${categoriaSeleccionada === 'todos' ? 'active' : ''}" onclick="filtrarCategoria('todos')"><span>Todas las Categorías</span></a></li>`;
            
            for (const [cat, subcats] of Object.entries(categoriasMap)) {
                html += `
                    <li class="cat-item">
                        <a class="cat-link ${categoriaSeleccionada === cat ? 'active' : ''}" onclick="filtrarCategoria('${cat}')">
                            <span>${cat}</span>
                        </a>
                `;
                if (subcats.size > 0) {
                    html += `<ul class="subcat-list">`;
                    subcats.forEach(sub => {
                        html += `<li class="subcat-item"><a class="subcat-link" onclick="filtrarSubcategoria('${cat}', '${sub}')">${sub}</a></li>`;
                    });
                    html += `</ul>`;
                }
                html += `</li>`;
            }
            sidebarList.innerHTML = html;
        }

        window.filtrarCategoria = function(cat) {
            categoriaSeleccionada = cat;
            subcategoriaSeleccionada = "";
            document.getElementById("current-category-title").innerText = cat === 'todos' ? 'Catálogo de Productos' : cat;
            
            let filtrados = cat === 'todos' ? productosGlobal : productosGlobal.filter(p => p.categoria === cat);
            renderizarProductos(filtrados);
            generarMenuLateral();
        };

        window.filtrarSubcategoria = function(cat, sub) {
            categoriaSeleccionada = cat;
            subcategoriaSeleccionada = sub;
            document.getElementById("current-category-title").innerText = `${cat} > ${sub}`;
            
            let filtrados = productosGlobal.filter(p => p.categoria === cat && p.subcategoria === sub);
            renderizarProductos(filtrados);
        };

        function renderizarProductos(productos) {
            const grid = document.getElementById("products-grid");
            grid.innerHTML = "";
            if (productos.length === 0) {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #94a3b8;'>No se encontraron productos en esta sección.</p>";
                return;
            }
            productos.forEach(prod => {
                const imgUrl = (prod.imagenes && prod.imagenes.length > 0) ? prod.imagenes[0] : 'https://via.placeholder.com/200';
                const card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `
                    <img src="${imgUrl}" alt="${prod.nombre || 'Producto'}">
                    <h3>${prod.nombre || 'Sin nombre'}</h3>
                    <p class="price">$${prod.precio || 0}</p>
                    <button class="btn-detail" onclick="verDetalleProducto('${prod.id}')">Ver Detalle</button>
                `;
                grid.appendChild(card);
            });
        }

        window.verDetalleProducto = function(id) {
            const prod = productosGlobal.find(p => p.id === id);
            if (!prod) return;
            document.getElementById("modal-title").innerText = prod.nombre || '';
            document.getElementById("modal-price").innerText = `$${prod.precio || 0}`;
            document.getElementById("modal-description").innerText = prod.descripcion || 'Sin descripción disponible.';

            const imagenes = (prod.imagenes && prod.imagenes.length > 0) ? prod.imagenes : ['https://via.placeholder.com/400'];
            document.getElementById("modal-img").src = imagenes[0];

            const thumbs = document.getElementById("modal-thumbnails");
            thumbs.innerHTML = "";
            imagenes.forEach((img, idx) => {
                thumbs.innerHTML += `<img src="${img}" class="modal-thumb ${idx === 0 ? 'active' : ''}" onclick="document.getElementById('modal-img').src='${img}'">`;
            });

            const modal = document.getElementById("product-modal");
            modal.style.display = "block";
            setTimeout(() => modal.classList.add("active"), 10);
        };

        window.cerrarModal = function() {
            const modal = document.getElementById("product-modal");
            modal.classList.remove("active");
            setTimeout(() => modal.style.display = "none", 350);
        };

        // Buscador en tiempo real
        document.getElementById("search-input").addEventListener("input", (e) => {
            const texto = e.target.value.toLowerCase();
            const filtrados = productosGlobal.filter(p => (p.nombre && p.nombre.toLowerCase().includes(texto)) || (p.descripcion && p.descripcion.toLowerCase().includes(texto)));
            renderizarProductos(filtrados);
        });

        cargarDatos();
    </script>
</body>
</html>
