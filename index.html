<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peque Elektro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* MODAL DESLIZANTE EXACTO Y FLUIDO DE IZQUIERDA A DERECHA */
    #modal-producto {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95);
      z-index: 99999;
      display: none;
      overflow-y: auto;
      animation: deslizarModal 0.3s ease-out forwards;
    }
    @keyframes deslizarModal {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }
    .modal-content-wrapper {
      max-width: 900px;
      margin: 40px auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 30px;
      position: relative;
      color: white;
      box-shadow: 0 20px 25px rgba(0,0,0,0.5);
    }
    .btn-cerrar-modal {
      position: absolute;
      top: 20px; right: 20px;
      background: #ef4444;
      color: white;
      border: none;
      width: 40px; height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.2s;
    }
    .btn-cerrar-modal:hover { background: #dc2626; }

    .modal-imagen-principal {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      background: #0f172a;
      border-radius: 10px;
      border: 1px solid #334155;
      margin-bottom: 15px;
    }
    .modal-miniaturas {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 5px;
    }
    .modal-miniatura {
      width: 70px; height: 70px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }
    .modal-miniatura.activa { border-color: #38bdf8; }

    .modal-acciones {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #334155;
    }
    .cantidad-control {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
    }
    .cantidad-control button {
      background: #334155;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }
    .cantidad-control button:hover { background: #475569; }
    .cantidad-control span {
      padding: 0 20px;
      font-weight: bold;
      font-size: 16px;
    }
    .btn-add-carrito-modal {
      background: #22c55e;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: center;
    }
    .btn-add-carrito-modal:hover { background: #16a34a; }
  </style>
</head>
<body>

  <header class="banner-header">
    <img src="logo.jpg" alt="Peque Elektro" class="banner-img">
  </header>

  <main class="main-container" style="padding: 20px; max-width: 1200px; margin: 0 auto;">
    
    <!-- SLOGAN / PRESENTACIÓN -->
    <section id="seccion-slogan" style="background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 12px; margin-bottom: 30px; text-align: center; color: white;">
      <h1 id="slogan-titulo" style="color: #38bdf8; margin-bottom: 10px;">Cargando...</h1>
      <p id="slogan-intro" style="color: #94a3b8; margin-bottom: 15px;"></p>
      <div id="slogan-items" style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; font-size: 14px; color: #cbd5e1;"></div>
      <span id="slogan-badge" style="background: #0284c7; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; display: inline-block;"></span>
    </section>

    <!-- CATÁLOGO -->
    <section>
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
        <h2 style="color: #38bdf8; margin: 0;"><i class="fa-solid fa-store"></i> Catálogo de Productos</h2>
        <input type="text" id="buscador-index" placeholder="Buscar producto..." style="padding: 10px 15px; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: white; min-width: 250px;">
      </div>
      <div id="grid-productos-index" class="products-grid">
        <p style="text-align:center; color:#94a3b8; grid-column: 1/-1;">Cargando catálogo...</p>
      </div>
    </section>

  </main>

  <!-- VENTANA FLOTANTE / MODAL -->
  <div id="modal-producto">
    <div class="modal-content-wrapper">
      <button class="btn-cerrar-modal" id="btn-cerrar-modal"><i class="fa-solid fa-xmark"></i></button>
      
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px;">
        <div>
          <img id="modal-img-principal" class="modal-imagen-principal" src="" alt="Imagen principal">
          <div id="modal-miniaturas-container" class="modal-miniaturas"></div>
        </div>

        <div>
          <span id="modal-cat" style="color: #38bdf8; font-size: 13px; font-weight: bold; text-transform: uppercase;"></span>
          <h2 id="modal-titulo" style="margin: 8px 0 15px 0; font-size: 24px;"></h2>
          <div id="modal-precio" style="color: #22c55e; font-size: 26px; font-weight: bold; margin-bottom: 20px;"></div>
          
          <div style="margin-bottom: 20px;">
            <strong style="color: #38bdf8; display: block; margin-bottom: 5px;">Descripción y Ficha Técnica:</strong>
            <p id="modal-descripcion" style="color: #cbd5e1; font-size: 14px; white-space: pre-wrap; line-height: 1.6; max-height: 200px; overflow-y: auto; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155;"></p>
          </div>

          <div id="modal-colores-seccion" style="margin-bottom: 20px; display: none;">
            <strong style="color: #38bdf8; display: block; margin-bottom: 6px;">Colores disponibles:</strong>
            <div id="modal-colores" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
          </div>

          <!-- BOTONES DE CANTIDAD Y CARRITO -->
          <div class="modal-acciones">
            <div class="cantidad-control">
              <button id="btn-restar">-</button>
              <span id="modal-cantidad">1</span>
              <button id="btn-sumar">+</button>
            </div>
            <button id="btn-agregar-carrito" class="btn-add-carrito-modal">
              <i class="fa-solid fa-cart-plus"></i> Agregar al Carrito
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTtYfbeNy7z15Pj3Suli68mVGioMFU21E",
      authDomain: "peque-elektro.firebaseapp.com",
      projectId: "peque-elektro",
      storageBucket: "peque-elektro.firebasestorage.app",
      messagingSenderId: "873169424486",
      appId: "1:873169424486:web:e9f77cb2052aa06b3b9da7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let listaProductosGlobal = [];
    let productoActualModal = null;
    let cantidadSeleccionada = 1;

    document.addEventListener("DOMContentLoaded", () => {
      cargarSloganIndex();
      cargarCatalogoIndex();
    });

    async function cargarSloganIndex() {
      try {
        const snap = await getDoc(doc(db, "configuracion", "slogan"));
        if (snap.exists()) {
          const d = snap.data();
          document.getElementById("slogan-titulo").innerText = d.titulo || "";
          document.getElementById("slogan-intro").innerText = d.intro || "";
          
          let itemsHtml = "";
          if(d.item1) itemsHtml += `<span><i class="fa-solid fa-check" style="color:#38bdf8;"></i> ${d.item1}</span>`;
          if(d.item2) itemsHtml += `<span><i class="fa-solid fa-check" style="color:#38bdf8;"></i> ${d.item2}</span>`;
          if(d.item3) itemsHtml += `<span><i class="fa-solid fa-check" style="color:#38bdf8;"></i> ${d.item3}</span>`;
          document.getElementById("slogan-items").innerHTML = itemsHtml;
          document.getElementById("slogan-badge").innerText = d.badge || "";
        }
      } catch (err) { console.error(err); }
    }

    async function cargarCatalogoIndex() {
      const grid = document.getElementById("grid-productos-index");
      try {
        const snap = await getDocs(collection(db, "productos"));
        listaProductosGlobal = [];
        snap.forEach(d => listaProductosGlobal.push({ id: d.id, ...d.data() }));
        renderizarGrid(listaProductosGlobal);
      } catch (err) {
        grid.innerHTML = '<p style="text-align:center; color:#ef4444; grid-column:1/-1;">Error al cargar.</p>';
      }
    }

    function renderizarGrid(productos) {
      const grid = document.getElementById("grid-productos-index");
      if (productos.length === 0) {
        grid.innerHTML = '<p style="text-align:center; color:#94a3b8; grid-column:1/-1;">No hay productos.</p>';
        return;
      }

      grid.innerHTML = productos.map(p => {
        // CORREGIDO: Muestra todas las imágenes del array guardado sin perder ninguna
        const imagenesArray = p.imagenes || (p.imagen ? [p.imagen] : ['https://via.placeholder.com/200']);
        const imgPrincipal = imagenesArray[0];

        return `
          <div class="product-card" onclick="window.abrirModalProducto('${p.id}')">
            <img src="${imgPrincipal}" alt="${p.nombre}">
            <div>
              <span style="font-size: 11px; color: #38bdf8; text-transform: uppercase;">${p.categoria || ''}</span>
              <h3 style="font-size: 16px; margin: 5px 0; color: white;">${p.nombre}</h3>
            </div>
            <p style="color: #22c55e; font-weight: bold; font-size: 18px; margin-top: 10px;">$${parseFloat(p.precio || 0).toLocaleString('es-AR')}</p>
          </div>
        `;
      }).join('');
    }

    document.getElementById("buscador-index").addEventListener("input", (e) => {
      const termino = e.target.value.toLowerCase().trim();
      const filtrados = listaProductosGlobal.filter(p => 
        p.nombre.toLowerCase().includes(termino) || 
        (p.categoria && p.categoria.toLowerCase().includes(termino))
      );
      renderizarGrid(filtrados);
    });

    window.abrirModalProducto = (id) => {
      const prod = listaProductosGlobal.find(p => p.id === id);
      if (!prod) return;
      productoActualModal = prod;
      cantidadSeleccionada = 1;
      document.getElementById("modal-cantidad").innerText = cantidadSeleccionada;

      document.getElementById("modal-cat").innerText = prod.categoria || "";
      document.getElementById("modal-titulo").innerText = prod.nombre;
      document.getElementById("modal-precio").innerText = `$${parseFloat(prod.precio || 0).toLocaleString('es-AR')}`;
      document.getElementById("modal-descripcion").innerText = prod.descripcion || "Sin descripción.";

      const imagenes = prod.imagenes || (prod.imagen ? [prod.imagen] : ['https://via.placeholder.com/300']);
      const imgPrinEl = document.getElementById("modal-img-principal");
      const miniaturasContainer = document.getElementById("modal-miniaturas-container");

      imgPrinEl.src = imagenes[0];
      
      if (imagenes.length > 1) {
        miniaturasContainer.style.display = "flex";
        miniaturasContainer.innerHTML = imagenes.map((img, idx) => `
          <img src="${img}" class="modal-miniatura ${idx === 0 ? 'activa' : ''}" onclick="window.cambiarImagenModal('${img}', this)">
        `).join('');
      } else {
        miniaturasContainer.style.display = "none";
        miniaturasContainer.innerHTML = "";
      }

      const seccionColores = document.getElementById("modal-colores-seccion");
      const contenedorColores = document.getElementById("modal-colores");
      if (prod.colores && prod.colores.length > 0) {
        seccionColores.style.display = "block";
        contenedorColores.innerHTML = prod.colores.map(c => `
          <span style="background: #0f172a; border: 1px solid #334155; padding: 5px 12px; border-radius: 6px; font-size: 13px;">${c}</span>
        `).join('');
      } else {
        seccionColores.style.display = "none";
      }

      document.getElementById("modal-producto").style.display = "block";
      document.body.style.overflow = "hidden";
    };

    window.cambiarImagenModal = (urlImg, elementoMiniatura) => {
      document.getElementById("modal-img-principal").src = urlImg;
      document.querySelectorAll(".modal-miniatura").forEach(m => m.classList.remove("activa"));
      elementoMiniatura.classList.add("activa");
    };

    document.getElementById("btn-sumar").addEventListener("click", () => {
      cantidadSeleccionada++;
      document.getElementById("modal-cantidad").innerText = cantidadSeleccionada;
    });

    document.getElementById("btn-restar").addEventListener("click", () => {
      if (cantidadSeleccionada > 1) {
        cantidadSeleccionada--;
        document.getElementById("modal-cantidad").innerText = cantidadSeleccionada;
      }
    });

    document.getElementById("btn-cerrar-modal").addEventListener("click", cerrarModal);
    document.getElementById("modal-producto").addEventListener("click", (e) => {
      if (e.target.id === "modal-producto") cerrarModal();
    });

    function cerrarModal() {
      document.getElementById("modal-producto").style.display = "none";
      document.body.style.overflow = "auto";
    }

    document.getElementById("btn-agregar-carrito").addEventListener("click", () => {
      if (!productoActualModal) return;
      alert(`✅ ¡Agregado al carrito!\n\nProducto: ${productoActualModal.nombre}\nCantidad: ${cantidadSeleccionada}`);
      cerrarModal();
    });
  </script>
</body>
</html>
