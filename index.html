<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peque Elektro - Tu Solución Integral</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <style>
    /* Estilos Generales y Reset */
    body { margin: 0; font-family: Arial, sans-serif; background-color: #0f172a; color: white; }
    * { box-sizing: border-box; }

    /* Barra Superior Fija (Altura aproximada de 10cm / ~100px) */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #1e293b;
      border-bottom: 2px solid #0284c7;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      min-height: 95px;
    }
    .top-brand-area {
      display: flex;
      align-items: center;
      gap: 25px;
    }
    .banner-mini {
      height: 70px;
      object-fit: contain;
    }
    .top-center-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .top-center-title {
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
      margin: 0 0 2px 0;
      text-transform: lowercase;
    }
    .top-center-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin: 0 0 4px 0;
    }
    .top-items-row {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: #cbd5e1;
    }
    .top-badge-container {
      margin-top: 4px;
    }
    .top-badge {
      background: #0284c7;
      color: white;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      display: inline-block;
    }

    .top-envios-info {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-left: 1px solid #334155;
      padding-left: 20px;
      max-width: 320px;
    }
    .top-envios-info span {
      color: #cbd5e1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-shrink: 0;
    }
    .cart-indicator {
      font-size: 18px;
      color: #38bdf8;
      font-weight: bold;
    }
    
    /* Botones Globales */
    .btn-rojo { background: #ef4444; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-rojo:hover { background: #dc2626; }
    .btn-azul { background: #0284c7; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-azul:hover { background: #0369a1; }
    .btn-verde { background: #22c55e; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 10px; }
    .btn-verde:hover { background: #16a34a; }

    /* Layout Pantalla Completa (Sin espacios negros sobrantes) */
    .shop-container {
      display: flex;
      gap: 20px;
      padding: 15px 20px;
      width: 100%;
      max-width: 100%;
    }
    
    /* Barra Lateral Izquierda */
    .sidebar-left {
      width: 280px;
      flex-shrink: 0;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      height: fit-content;
      position: sticky;
      top: 115px;
      border: 1px solid #334155;
    }

    /* Categorías */
    .category-group { margin-bottom: 15px; }
    .category-title {
      font-weight: bold;
      color: #38bdf8;
      cursor: pointer;
      padding: 10px;
      border-radius: 6px;
      background: #0f172a;
      display: flex;
      justify-content: space-between;
    }
    .subcategory-list { list-style: none; padding-left: 15px; margin-top: 5px; display: none; }
    .subcategory-list.active { display: block; }
    .subcategory-list li { color: #94a3b8; padding: 6px 0; cursor: pointer; font-size: 14px; }
    .subcategory-list li:hover { color: white; }

    /* Resumen de Pedido Lateral */
    .resumen-pedido { margin-top: 30px; padding-top: 20px; border-top: 1px solid #334155; }
    .lista-carrito { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; font-size: 13px; }
    .lista-carrito li { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      margin-bottom: 10px; 
      color: #cbd5e1; 
      border-bottom: 1px solid #334155; 
      padding-bottom: 8px; 
      gap: 5px;
    }
    .carrito-item-controles {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 2px 5px;
    }
    .carrito-item-controles button {
      background: transparent;
      color: #38bdf8;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }

    /* Grilla de Productos (5 de ancho por 6 de largo) */
    .main-content { flex-grow: 1; min-width: 0; }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(6, auto);
      gap: 15px;
    }
    .product-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .product-card img { width: 100%; height: 150px; object-fit: contain; border-radius: 8px; background: white; margin-bottom: 8px; }
    .product-card h3 { font-size: 13px; margin: 4px 0; color: #e2e8f0; height: 36px; overflow: hidden; }
    .product-card .price { font-size: 16px; color: #22c55e; font-weight: bold; margin-bottom: 8px; }
    
    .product-actions { display: flex; gap: 5px; }
    .product-actions button { flex: 1; padding: 6px; font-size: 12px; }

    /* Paginación */
    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 25px 0;
    }
    .pagination-container button {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .pagination-container button:hover:not(:disabled) { background: #0284c7; color: white; }
    .pagination-container button:disabled { opacity: 0.4; cursor: not-allowed; }
    .pagination-container span { color: #cbd5e1; font-weight: bold; }

    /* Toast Flotante */
    #toast-cart {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #22c55e;
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: none;
      z-index: 9999;
      font-weight: bold;
    }

    /* MODAL AMPLIADO */
    #modal-detalle {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95);
      z-index: 10000;
      display: none;
      overflow-y: auto;
      animation: deslizarModal 0.3s ease-out forwards;
    }
    @keyframes deslizarModal {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }
    .modal-content-wrapper {
      max-width: 1100px;
      margin: 30px auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 30px;
      position: relative;
      color: white;
      box-shadow: 0 20px 25px rgba(0,0,0,0.5);
    }
    .btn-cerrar-modal {
      position: absolute;
      top: 20px; right: 20px;
      background: #ef4444;
      color: white;
      border: none;
      width: 40px; height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .btn-cerrar-modal:hover { background: #dc2626; }

    .modal-grid-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }
    @media (max-width: 850px) {
      .modal-grid-top { grid-template-columns: 1fr; }
    }

    .modal-img-container {
      width: 100%;
      max-height: 380px;
      background: white;
      border-radius: 10px;
      border: 1px solid #334155;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      position: relative;
    }
    .modal-imagen-principal {
      width: 100%;
      height: 380px;
      object-fit: contain;
      transition: transform 0.3s ease;
      cursor: zoom-in;
    }
    .modal-miniaturas {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 15px;
      padding-bottom: 5px;
    }
    .modal-miniatura {
      width: 70px; height: 70px;
      object-fit: cover;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .modal-miniatura.activa { border-color: #38bdf8; }

    .modal-acciones {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
    }
    .cantidad-control {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      height: 45px;
    }
    .cantidad-control button {
      background: #334155;
      color: white;
      border: none;
      padding: 0 15px;
      cursor: pointer;
      font-weight: bold;
      font-size: 18px;
      height: 100%;
    }
    .cantidad-control span {
      padding: 0 15px;
      font-weight: bold;
      font-size: 16px;
    }
    .btn-add-carrito-modal {
      background: #22c55e;
      color: white;
      border: none;
      padding: 0 25px;
      height: 45px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: center;
    }
    .btn-add-carrito-modal:hover { background: #16a34a; }

    .modal-descripcion-full {
      margin-top: 25px;
      border-top: 1px solid #334155;
      padding-top: 20px;
    }
    .modal-descripcion-texto {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.7;
      max-height: 250px;
      overflow-y: auto;
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    @media (max-width: 1400px) { .products-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 1100px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 850px) {
      .shop-container { flex-direction: column; }
      .sidebar-left { width: 100%; position: static; }
      .products-grid { grid-template-columns: repeat(2, 1fr); }
      .top-envios-info { display: none; }
    }
    @media (max-width: 500px) { .products-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- BARRA FIJA SUPERIOR AMPLIADA (CON DATOS DINÁMICOS DE FIREBASE) -->
  <header class="top-bar">
    <div class="top-brand-area">
      <img src="logo.jpg" alt="Peque Elektro" class="banner-mini">
      <div class="top-center-info">
        <h1 class="top-center-title" id="top-title-txt">Cargando...</h1>
        <p class="top-center-subtitle" id="top-subtitle-txt">Cargando...</p>
        <div class="top-items-row" id="top-items-container"></div>
        <div class="top-badge-container" id="top-badge-wrapper" style="display:none;">
          <span class="top-badge" id="top-badge-txt"></span>
        </div>
      </div>
    </div>
    
    <div class="top-envios-info" id="top-envios-container">
      <span>📍 <strong style="color:#38bdf8;">Zonales:</strong> <span id="top-envio-local">Cargando...</span></span>
      <span>📦 <strong style="color:#38bdf8;">País:</strong> <span id="top-envio-pais">Cargando...</span></span>
      <span id="top-envio-extra-wrap" style="display:none;">🚚 <span id="top-envio-extra"></span></span>
    </div>

    <div class="header-actions">
      <div class="cart-indicator">
        <i class="fa-solid fa-cart-shopping"></i> <span id="cart-count-top">0</span>
      </div>
      <button class="btn-rojo" onclick="finalizarPedidoWhatsapp()">
        <i class="fa-brands fa-whatsapp"></i> Finalizar y Enviar
      </button>
    </div>
  </header>

  <!-- MENSAJE FLOTANTE AL AGREGAR AL CARRITO -->
  <div id="toast-cart"><i class="fa-solid fa-circle-check"></i> Producto agregado al pedido</div>

  <div class="shop-container">
    
    <!-- BARRA LATERAL IZQUIERDA -->
    <aside class="sidebar-left">
      <h3 style="color: white; margin-top: 0;"><i class="fa-solid fa-list"></i> Categorías</h3>
      <div id="categories-tree"></div>

      <!-- RESUMEN DE TU PEDIDO -->
      <div class="resumen-pedido">
        <h3 style="color: #38bdf8; margin-top: 0;"><i class="fa-solid fa-basket-shopping"></i> Tu Pedido</h3>
        <ul id="lista-carrito-lateral" class="lista-carrito">
          <li style="color: #94a3b8;">El carrito está vacío.</li>
        </ul>
        <div style="font-size: 18px; font-weight: bold; margin-top: 10px; color: white;">
          Total: $<span id="total-carrito">0.00</span>
        </div>
        <button class="btn-verde" onclick="finalizarPedidoWhatsapp()">
          <i class="fa-brands fa-whatsapp"></i> Enviar Pedido
        </button>
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL DE PRODUCTOS -->
    <main class="main-content">
      <input type="text" id="buscar-input" placeholder="Buscar productos..." style="width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; margin-bottom: 20px; font-size: 15px;">

      <div id="grid-productos" class="products-grid"></div>

      <!-- CONTROLES DE PAGINACIÓN -->
      <div class="pagination-container" id="pagination-controls">
        <button id="btn-prev" onclick="cambiarPagina(-1)"><i class="fa-solid fa-chevron-left"></i> Anterior</button>
        <span id="page-indicator">Página 1 de 1</span>
        <button id="btn-next" onclick="cambiarPagina(1)">Siguiente <i class="fa-solid fa-chevron-right"></i></button>
      </div>

      <!-- SECCIÓN DE COMENTARIOS (ANTI-BOT) -->
      <section style="margin-top: 30px; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155;">
        <h3 style="color: #38bdf8; margin-top: 0;"><i class="fa-solid fa-comments"></i> Consultas y Opiniones</h3>
        
        <form id="form-resena" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
          <input type="text" id="resena-nombre" placeholder="Tu nombre" required style="padding: 12px; border-radius: 6px; background: #0f172a; color: white; border: 1px solid #334155;">
          <textarea id="resena-texto" placeholder="Escribe tu consulta..." required style="padding: 12px; border-radius: 6px; background: #0f172a; color: white; border: 1px solid #334155; height: 80px;"></textarea>
          
          <div style="background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 6px; display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="chk-captcha" style="width: 22px; height: 22px; cursor: pointer;">
            <label for="chk-captcha" style="color: white; cursor: pointer; font-weight: bold;">No soy un robot 🤖</label>
          </div>

          <button type="submit" class="btn-azul">Publicar Comentario</button>
        </form>
        <div id="lista-resenas"></div>
      </section>
    </main>

  </div>

  <!-- MODAL DE DETALLES -->
  <div id="modal-detalle">
    <div class="modal-content-wrapper">
      <button class="btn-cerrar-modal" onclick="cerrarModal()"><i class="fa-solid fa-xmark"></i></button>
      
      <div class="modal-grid-top">
        <div>
          <div class="modal-img-container" id="zoom-container">
            <img id="modal-img" class="modal-imagen-principal" src="" alt="Imagen principal">
          </div>
          <div id="modal-miniaturas-container" class="modal-miniaturas"></div>
        </div>

        <div>
          <h2 id="modal-titulo" style="color: #38bdf8; margin-top: 0; font-size: 24px;"></h2>
          <div id="modal-precio" style="color: #22c55e; font-size: 28px; font-weight: bold; margin-bottom: 20px;"></div>
          
          <div class="modal-acciones">
            <div class="cantidad-control">
              <button onclick="cambiarCantidadModal(-1)">-</button>
              <span id="modal-cantidad-txt">1</span>
              <button onclick="cambiarCantidadModal(1)">+</button>
            </div>
            <button class="btn-add-carrito-modal" onclick="agregarDesdeModal()">
              <i class="fa-solid fa-cart-plus"></i> Agregar al Carrito
            </button>
          </div>
        </div>
      </div>

      <div class="modal-descripcion-full">
        <strong style="color: #38bdf8; display: block; margin-bottom: 8px; font-size: 16px;">Descripción y Ficha Técnica:</strong>
        <div id="modal-descripcion" class="modal-descripcion-texto"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, getDoc, doc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTtYfbeNy7z15Pj3Suli68mVGioMFU21E",
      authDomain: "peque-elektro.firebaseapp.com",
      projectId: "peque-elektro",
      storageBucket: "peque-elektro.firebasestorage.app",
      messagingSenderId: "873169424486",
      appId: "1:873169424486:web:e9f77cb2052aa06b3b9da7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let productos = [];
    let productosFiltrados = [];
    let carrito = [];
    let paginaActual = 1;
    const productosPorPagina = 30; // 5 de ancho x 6 de largo
    let productoActualModalId = null;
    let cantidadModalActual = 1;
    const numeroWhatsapp = "5491134970171";

    async function init() {
      cargarConfiguracionPresentacion();
      cargarConfiguracionEnvios();
      
      const snap = await getDocs(collection(db, "productos"));
      snap.forEach(d => productos.push({ id: d.id, ...d.data() }));
      productosFiltrados = [...productos];
      renderizarPagina();
      renderCategorias();
      cargarResenas();
    }

    async function cargarConfiguracionPresentacion() {
      try {
        const snap = await getDoc(doc(db, "configuracion", "presentacion"));
        if (snap.exists()) {
          const d = snap.data();
          document.getElementById("top-title-txt").textContent = d.titulo || 'peque elektro: tu solución integral.';
          document.getElementById("top-subtitle-txt").textContent = d.subtitulo || '';
          
          let itemsHtml = '';
          if (d.item1) itemsHtml += `<span>• ${d.item1}</span>`;
          if (d.item2) itemsHtml += `<span>• ${d.item2}</span>`;
          if (d.item3) itemsHtml += `<span>• ${d.item3}</span>`;
          document.getElementById("top-items-container").innerHTML = itemsHtml;

          if (d.badge) {
            document.getElementById("top-badge-txt").textContent = d.badge;
            document.getElementById("top-badge-wrapper").style.display = "block";
          }
        }
      } catch (err) { console.error("Error al cargar presentación:", err); }
    }

    async function cargarConfiguracionEnvios() {
      try {
        const snapEnvios = await getDoc(doc(db, "configuracion", "envios"));
        if (snapEnvios.exists()) {
          const d = snapEnvios.data();
          document.getElementById("top-envio-local").textContent = d.locales || 'Disponibles';
          document.getElementById("top-envio-pais").textContent = d.pais || 'A todo el país';
          
          if (d.extra) {
            document.getElementById("top-envio-extra").textContent = d.extra;
            document.getElementById("top-envio-extra-wrap").style.display = "block";
          }
        }
      } catch (err) { console.error("Error al cargar envíos:", err); }
    }

    function renderizarPagina() {
      const grid = document.getElementById("grid-productos");
      const inicio = (paginaActual - 1) * productosPorPagina;
      const fin = inicio + productosPorPagina;
      const productosPagina = productosFiltrados.slice(inicio, fin);

      grid.innerHTML = productosPagina.map(p => {
        const img = (p.imagenes && p.imagenes[0]) || p.imagen || 'https://via.placeholder.com/200';
        return `
          <div class="product-card">
            <img src="${img}" alt="${p.nombre}">
            <h3>${p.nombre}</h3>
            <p class="price">$${parseFloat(p.precio || 0).toLocaleString('es-AR')}</p>
            <div class="product-actions">
              <button class="btn-azul" onclick="verDetalles('${p.id}')">Ver Detalle</button>
              <button class="btn-rojo" onclick="agregarAlCarrito('${p.id}', 1)">Agregar</button>
            </div>
          </div>
        `;
      }).join('');

      actualizarPaginacionUI();
    }

    function actualizarPaginacionUI() {
      const totalPaginas = Math.ceil(productosFiltrados.length / productosPorPagina) || 1;
      document.getElementById("page-indicator").textContent = `Página ${paginaActual} de ${totalPaginas}`;
      document.getElementById("btn-prev").disabled = paginaActual === 1;
      document.getElementById("btn-next").disabled = paginaActual >= totalPaginas;
    }

    window.cambiarPagina = (dir) => {
      const totalPaginas = Math.ceil(productosFiltrados.length / productosPorPagina);
      paginaActual += dir;
      if (paginaActual < 1) paginaActual = 1;
      if (paginaActual > totalPaginas) paginaActual = totalPaginas;
      renderizarPagina();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function renderCategorias() {
      const container = document.getElementById("categories-tree");
      const tree = {};

      productos.forEach(p => {
        const cat = p.categoria || "Otros";
        const sub = p.subcategoria || "";
        if (!tree[cat]) tree[cat] = new Set();
        if (sub) tree[cat].add(sub);
      });

      let html = `<div class="category-group"><div class="category-title" onclick="filtrarCat('')">Todas las Categorías</div></div>`;

      for (const [cat, subs] of Object.entries(tree)) {
        html += `
          <div class="category-group">
            <div class="category-title" onclick="toggleSubcats('${cat}')">
              ${cat} <i class="fa-solid fa-chevron-down"></i>
            </div>
            <ul id="sub-${cat}" class="subcategory-list">
              <li onclick="filtrarCat('${cat}')">Ver todo en ${cat}</li>
              ${Array.from(subs).map(s => `<li onclick="filtrarSubcat('${cat}', '${s}')">${s}</li>`).join('')}
            </ul>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    window.toggleSubcats = (cat) => {
      const el = document.getElementById(`sub-${cat}`);
      if (el) el.classList.toggle("active");
    };

    window.filtrarCat = (cat) => {
      paginaActual = 1;
      if (!cat) {
        productosFiltrados = [...productos];
      } else {
        productosFiltrados = productos.filter(p => p.categoria === cat);
      }
      renderizarPagina();
    };

    window.filtrarSubcat = (cat, sub) => {
      paginaActual = 1;
      productosFiltrados = productos.filter(p => p.categoria === cat && p.subcategoria === sub);
      renderizarPagina();
    };

    window.agregarAlCarrito = (id, cantidad = 1) => {
      const prod = productos.find(p => p.id === id);
      if (!prod) return;
      const index = carrito.findIndex(item => item.id === id);
      if (index > -1) {
        carrito[index].cantidad += cantidad;
      } else {
        carrito.push({ ...prod, cantidad: cantidad });
      }
      actualizarCarritoUI();
      mostrarToast();
    };

    window.modificarCantidadCarrito = function(id, cambio) {
      const index = carrito.findIndex(item => item.id === id);
      if (index > -1) {
        carrito[index].cantidad += cambio;
        if (carrito[index].cantidad <= 0) {
          carrito.splice(index, 1);
        }
        actualizarCarritoUI();
      }
    };

    function actualizarCarritoUI() {
      const lista = document.getElementById("lista-carrito-lateral");
      const totalEl = document.getElementById("total-carrito");
      const countTop = document.getElementById("cart-count-top");

      let total = 0;
      let count = 0;

      if (carrito.length === 0) {
        lista.innerHTML = '<li style="color: #94a3b8;">El carrito está vacío.</li>';
      } else {
        lista.innerHTML = carrito.map(i => {
          const subtotal = parseFloat(i.precio) * i.cantidad;
          total += subtotal;
          count += i.cantidad;
          return `
            <li>
              <span>${i.nombre}</span>
              <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                <span style="font-weight: bold; color: #22c55e;">$${subtotal.toLocaleString('es-AR')}</span>
                <div class="carrito-item-controles">
                  <button onclick="modificarCantidadCarrito('${i.id}', -1)">-</button>
                  <span style="color: white; font-weight: bold; font-size: 11px;">${i.cantidad}</span>
                  <button onclick="modificarCantidadCarrito('${i.id}', 1)">+</button>
                </div>
              </div>
            </li>
          `;
        }).join('');
      }

      totalEl.textContent = total.toLocaleString('es-AR');
      countTop.textContent = count;
    }

    function mostrarToast() {
      const toast = document.getElementById("toast-cart");
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 2500);
    }

    window.finalizarPedidoWhatsapp = async () => {
      if (carrito.length === 0) return alert("Tu carrito está vacío.");

      const total = carrito.reduce((acc, i) => acc + (parseFloat(i.precio) * i.cantidad), 0);
      try {
        await addDoc(collection(db, "pedidos"), {
          orden: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
          fecha: new Date().toLocaleDateString(),
          timestamp: Date.now(),
          estado: "Pendiente",
          items: carrito,
          total: total
        });
      } catch (err) { console.error(err); }

      let mensaje = "Hola Peque Elektro, quiero realizar el siguiente pedido:%0A%0A";
      carrito.forEach(i => {
        mensaje += `• ${i.nombre} x${i.cantidad} - $${(parseFloat(i.precio) * i.cantidad).toLocaleString('es-AR')}%0A`;
      });
      mensaje += `%0A*Total Estimado: $${total.toLocaleString('es-AR')}*`;

      window.open(`https://wa.me/${numeroWhatsapp}?text=${mensaje}`, '_blank');
    };

    window.verDetalles = (id) => {
      const p = productos.find(item => item.id === id);
      if (!p) return;
      
      productoActualModalId = id;
      cantidadModalActual = 1;
      document.getElementById("modal-cantidad-txt").textContent = cantidadModalActual;

      document.getElementById("modal-titulo").textContent = p.nombre;
      document.getElementById("modal-precio").textContent = `$${parseFloat(p.precio).toLocaleString('es-AR')}`;
      document.getElementById("modal-descripcion").textContent = p.descripcion || "Sin especificaciones detalladas.";

      const imagenes = (p.imagenes && p.imagenes.length > 0) ? p.imagenes : [p.imagen || 'https://via.placeholder.com/300'];
      const imgPrincipalEl = document.getElementById("modal-img");
      const miniaturasContainer = document.getElementById("modal-miniaturas-container");

      imgPrincipalEl.src = imagenes[0];

      if (imagenes.length > 1) {
        miniaturasContainer.style.display = "flex";
        miniaturasContainer.innerHTML = imagenes.map((imgUrl, idx) => `
          <img src="${imgUrl}" class="modal-miniatura ${idx === 0 ? 'activa' : ''}" onclick="cambiarImagenModal('${imgUrl}', this)">
        `).join('');
      } else {
        miniaturasContainer.style.display = "none";
        miniaturasContainer.innerHTML = "";
      }

      document.getElementById("modal-detalle").style.display = "flex";
    };

    window.cambiarImagenModal = (urlImg, elementoMiniatura) => {
      document.getElementById("modal-img").src = urlImg;
      document.querySelectorAll(".modal-miniatura").forEach(m => m.classList.remove("activa"));
      elementoMiniatura.classList.add("activa");
    };

    const zoomContainer = document.getElementById("zoom-container");
    const modalImg = document.getElementById("modal-img");

    zoomContainer.addEventListener("mousemove", (e) => {
      const rect = zoomContainer.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      modalImg.style.transformOrigin = `${x}% ${y}%`;
      modalImg.style.transform = "scale(2)";
    });

    zoomContainer.addEventListener("mouseleave", () => {
      modalImg.style.transformOrigin = "center center";
      modalImg.style.transform = "scale(1)";
    });

    window.cambiarCantidadModal = (delta) => {
      cantidadModalActual += delta;
      if (cantidadModalActual < 1) cantidadModalActual = 1;
      document.getElementById("modal-cantidad-txt").textContent = cantidadModalActual;
    };

    window.agregarDesdeModal = () => {
      if (!productoActualModalId) return;
      agregarAlCarrito(productoActualModalId, cantidadModalActual);
      cerrarModal();
    };

    window.cerrarModal = () => {
      document.getElementById("modal-detalle").style.display = "none";
    };

    document.getElementById("form-resena").addEventListener("submit", async (e) => {
      e.preventDefault();
      const captcha = document.getElementById("chk-captcha").checked;
      
      if (!captcha) {
        return alert("⚠️ Por favor, confirma que no eres un robot.");
      }

      const nombre = document.getElementById("resena-nombre").value.trim();
      const texto = document.getElementById("resena-texto").value.trim();

      await addDoc(collection(db, "resenas"), {
        nombre,
        texto,
        fecha: new Date().toLocaleDateString()
      });

      document.getElementById("form-resena").reset();
      cargarResenas();
    });

    async function cargarResenas() {
      const snap = await getDocs(collection(db, "resenas"));
      const list = document.getElementById("lista-resenas");
      let html = "";
      snap.forEach(d => {
        const r = d.data();
        html += `
          <div style="background: #0f172a; padding: 15px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #38bdf8;">
            <strong style="color: #38bdf8;">${r.nombre}</strong> <small style="color: #64748b;">(${r.fecha})</small>
            <p style="color: #cbd5e1; margin: 8px 0 0 0;">${r.texto}</p>
          </div>
        `;
      });
      list.innerHTML = html || '<p style="color: #64748b;">No hay opiniones aún. ¡Sé el primero!</p>';
    }

    document.getElementById("buscar-input").addEventListener("input", (e) => {
      const txt = e.target.value.toLowerCase();
      paginaActual = 1;
      productosFiltrados = productos.filter(p => p.nombre.toLowerCase().includes(txt));
      renderizarPagina();
    });

    init();
  </script>
</body>
</html>
