<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peque Elektro - Catálogo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* Estilos Modal / Pop-up estilo e-commerce */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center;
      align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal-content {
      background: #1e293b; color: #fff; padding: 25px; border-radius: 12px;
      max-width: 500px; width: 90%; max-height: 85vh; overflow-y: auto;
      position: relative; text-align: left;
    }
    .modal-close {
      position: absolute; top: 15px; right: 15px; background: none;
      border: none; color: #94a3b8; font-size: 24px; cursor: pointer;
    }
    .card-click { cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>Peque Elektro</h1>
    <p>Tu catálogo de productos en un solo lugar</p>
  </header>

  <main class="container">
    <h2>Nuestros Productos</h2>
    <div id="grid-productos" class="grid-productos">
      <p style="color: #94a3b8; text-align: center; grid-column: 1/-1;">Cargando productos...</p>
    </div>
  </main>

  <!-- VENTANA FLOTANTE (MODAL DE DETALLE) -->
  <div id="product-modal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" onclick="cerrarModal()">&times;</button>
      <img id="modal-img" src="" alt="" style="width:100%; max-height:250px; object-fit:contain; border-radius:8px; margin-bottom:15px;">
      <h2 id="modal-title" style="margin-bottom:5px;"></h2>
      <p id="modal-price" class="precio" style="font-size: 20px; font-weight: bold; color: #4f46e5; margin-bottom:15px;"></p>
      <div id="modal-desc" style="color: #cbd5e1; white-space: pre-line; line-height: 1.5; margin-bottom:20px;"></div>
      <button id="modal-add-btn" class="btn-add" style="width:100%;">Agregar al carrito</button>
    </div>
  </div>

  <section id="carrito" class="checkout-section">
    <div class="checkout-card">
      <h3>Tu Pedido</h3>
      <div id="cart-list" class="cart-list">
        <p class="empty-msg">Aún no has agregado productos a tu lista.</p>
      </div>
      <div class="total-box">
        <strong>Total Estimado: $<span id="cart-total">0.00</span></strong>
      </div>
      <button onclick="enviarWhatsApp()" class="btn-whatsapp">
        <i class="fa-brands fa-whatsapp"></i> Enviar Pedido por WhatsApp
      </button>
    </div>
  </section>

  <footer>
    <p>&copy; Peque Elektro - Todos los derechos reservados</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTtYfbeNy7z15Pj3Suli68mVGioMFU21E",
      authDomain: "peque-elektro.firebaseapp.com",
      projectId: "peque-elektro",
      storageBucket: "peque-elektro.firebasestorage.app",
      messagingSenderId: "873169424486",
      appId: "1:873169424486:web:e9f77cb2052aa06b3b9da7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let productosData = [];
    let carrito = [];
    const NUMERO_WHATSAPP = "5491100000000";

    async function cargarProductos() {
      const contenedor = document.getElementById('grid-productos');
      try {
        const querySnapshot = await getDocs(collection(db, "productos"));
        contenedor.innerHTML = "";
        productosData = [];

        if(querySnapshot.empty) {
          contenedor.innerHTML = `<p style="color: #94a3b8; text-align: center; grid-column: 1/-1;">No hay productos cargados.</p>`;
          return;
        }

        querySnapshot.forEach((doc) => {
          const prod = { id: doc.id, ...doc.data() };
          productosData.push(prod);
          
          contenedor.innerHTML += `
            <div class="card card-click" onclick="abrirModal('${prod.id}')">
              <img src="${prod.imagen}" alt="${prod.nombre}" style="width:100%; height:180px; object-fit:cover; border-radius:8px;">
              <h3>${prod.nombre}</h3>
              <p class="precio">$${prod.precio}</p>
              <button onclick="event.stopPropagation(); agregarAlCarrito('${prod.nombre}', ${prod.precio})" class="btn-add">Agregar al carrito</button>
            </div>
          `;
        });
      } catch (e) {
        contenedor.innerHTML = `<p style="color: red; grid-column: 1/-1;">Error al cargar productos.</p>`;
      }
    }

    window.abrirModal = (id) => {
      const prod = productosData.find(p => p.id === id);
      if(!prod) return;
      document.getElementById('modal-img').src = prod.imagen;
      document.getElementById('modal-title').innerText = prod.nombre;
      document.getElementById('modal-price').innerText = `$${prod.precio}`;
      document.getElementById('modal-desc').innerText = prod.descripcion;
      
      const addBtn = document.getElementById('modal-add-btn');
      addBtn.onclick = () => {
        agregarAlCarrito(prod.nombre, prod.precio);
        cerrarModal();
      };

      document.getElementById('product-modal').classList.add('active');
    };

    window.cerrarModal = () => {
      document.getElementById('product-modal').classList.remove('active');
    };

    window.agregarAlCarrito = (nombre, precio) => {
      carrito.push({ nombre, precio });
      actualizarCarritoUI();
    };

    function actualizarCarritoUI() {
      const lista = document.getElementById('cart-list');
      const totalSpan = document.getElementById('cart-total');
      if (carrito.length === 0) {
        lista.innerHTML = `<p class="empty-msg">Aún no has agregado productos a tu lista.</p>`;
        totalSpan.innerText = "0.00";
        return;
      }

      lista.innerHTML = "";
      let total = 0;
      carrito.forEach((p) => {
        total += p.precio;
        lista.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom: 5px;"><span>${p.nombre}</span> <span>$${p.precio}</span></div>`;
      });
      totalSpan.innerText = total.toFixed(2);
    }

    window.enviarWhatsApp = () => {
      if (carrito.length === 0) return alert("Agrega al menos un producto.");
      let mensaje = "¡Hola Peque Elektro! Quiero realizar el siguiente pedido:\n\n";
      let total = 0;
      carrito.forEach((p) => {
        mensaje += `- ${p.nombre}: $${p.precio}\n`;
        total += p.precio;
      });
      mensaje += `\n*Total Estimado: $${total}*`;
      window.open(`https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`, '_blank');
    };

    cargarProductos();
  </script>
</body>
</html>
