<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peque Elektro</title>
    <style>
        :root {
            --primary-color: #ff6b00;
            --secondary-color: #222;
            --bg-color: #f9f9f9;
            --card-bg: #fff;
            --text-color: #333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        header {
            background-color: var(--secondary-color);
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .product-card-body {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .product-card-price {
            color: var(--primary-color);
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn-ver {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-ver:hover {
            background-color: var(--primary-color);
        }

        /* Modal de Detalle de Producto */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: white;
            border-radius: 8px;
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        @media(max-width: 768px) {
            .modal-content {
                grid-template-columns: 1fr;
            }
        }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
        }
        .modal-left {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-main-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 6px;
            cursor: zoom-in;
            border: 1px solid #ddd;
        }
        .modal-right {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .modal-price {
            font-size: 1.3rem;
            color: var(--primary-color);
            font-weight: bold;
        }
        
        /* DESCRIPCIÓN CON SEPARACIONES Y SALTOS DE LÍNEA */
        .product-description-box {
            white-space: pre-line;
            color: #555;
            font-size: 0.95rem;
            line-height: 1.5;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid var(--primary-color);
        }

        .btn-agregar-pedido {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 5px;
        }
        .btn-agregar-pedido:hover {
            opacity: 0.9;
        }

        /* MINIATURAS COLOCADAS DEBAJO DEL BOTÓN DE AGREGAR PEDIDO */
        .modal-thumbnails {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .modal-thumbnails img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .modal-thumbnails img:hover, .modal-thumbnails img.active {
            border-color: var(--primary-color);
        }

        /* ZOOM LIGHTBOX EN PANTALLA COMPLETA */
        .zoom-lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            cursor: zoom-out;
        }
        .zoom-lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 4px;
        }
        .zoom-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Peque Elektro</h1>
        <p>Materiales eléctricos y tecnología</p>
    </header>

    <div class="container">
        <div class="catalog" id="catalog">
            <!-- Producto de Ejemplo -->
            <div class="product-card" onclick="abrirModal('Kit de Herramientas Eléctricas Pro', '$45.000', 'Incluye taladro percutor, atornillador inalámbrico\ny maletín de transporte reforzado.\n\nIdeal para profesionales y uso hogareño.\n\nVoltaje: 220V', ['https://images.unsplash.com/photo-1504148455328-c376907d081c?w=600', 'https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=600', 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=600'])">
                <img src="https://images.unsplash.com/photo-1504148455328-c376907d081c?w=600" alt="Producto">
                <div class="product-card-body">
                    <div>
                        <div class="product-card-title">Kit de Herramientas Eléctricas Pro</div>
                        <div class="product-card-price">$45.000</div>
                    </div>
                    <button class="btn-ver">Ver Producto</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Detalle -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModal()">&times;</span>
            
            <!-- Columna Izquierda: Imagen Principal -->
            <div class="modal-left">
                <img id="modalMainImg" class="modal-main-img" src="" alt="Imagen Principal" onclick="abrirZoom(this.src)">
            </div>

            <!-- Columna Derecha: Información, Descripción, Botón y Miniaturas -->
            <div class="modal-right">
                <div class="modal-title" id="modalTitle">Título del Producto</div>
                <div class="modal-price" id="modalPrice">$0</div>
                
                <!-- Descripción con separación -->
                <div class="product-description-box" id="modalDesc">
                    Descripción del producto.
                </div>

                <!-- Botón Agregar Pedido -->
                <button class="btn-agregar-pedido" onclick="agregarPedido()">Agregar Pedido</button>

                <!-- Miniaturas (Ubicadas DEBAJO del botón de agregar pedido) -->
                <div class="modal-thumbnails" id="modalThumbnails"></div>
            </div>
        </div>
    </div>

    <!-- Lightbox de Pantalla Completa -->
    <div class="zoom-lightbox" id="zoomLightbox" onclick="cerrarZoom()">
        <span class="zoom-close">&times;</span>
        <img id="zoomImg" src="" alt="Zoom Imagen">
    </div>

    <script>
        function abrirModal(titulo, precio, descripcion, imagenes) {
            document.getElementById('modalTitle').innerText = titulo;
            document.getElementById('modalPrice').innerText = precio;
            document.getElementById('modalDesc').innerText = descripcion;

            const mainImg = document.getElementById('modalMainImg');
            const thumbnailsContainer = document.getElementById('modalThumbnails');
            
            thumbnailsContainer.innerHTML = '';

            if (imagenes && imagenes.length > 0) {
                mainImg.src = imagenes[0];
                
                imagenes.forEach((imgSrc, index) => {
                    const thumb = document.createElement('img');
                    thumb.src = imgSrc;
                    if (index === 0) thumb.classList.add('active');
                    
                    thumb.onclick = function() {
                        mainImg.src = imgSrc;
                        document.querySelectorAll('.modal-thumbnails img').forEach(t => t.classList.remove('active'));
                        thumb.classList.add('active');
                    };
                    
                    thumbnailsContainer.appendChild(thumb);
                });
            }

            document.getElementById('productModal').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function abrirZoom(src) {
            const zoomLightbox = document.getElementById('zoomLightbox');
            const zoomImg = document.getElementById('zoomImg');
            zoomImg.src = src;
            zoomLightbox.style.display = 'flex';
        }

        function cerrarZoom() {
            document.getElementById('zoomLightbox').style.display = 'none';
        }

        function agregarPedido() {
            alert('¡Pedido agregado con éxito!');
            cerrarModal();
        }

        window.onclick = function(event) {
            const modal = document.getElementById('productModal');
            if (event.target === modal) {
                cerrarModal();
            }
        }
    </script>
</body>
</html>
