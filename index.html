<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peque Elektro - Tienda</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* ==== ESTILOS DE PAGINACIÓN ==== */
    .paginacion {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 30px 0;
      padding: 15px;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .paginacion button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .paginacion button:hover {
      background: #0369a1;
    }
    .paginacion button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .paginacion .pagina-activa {
      background: #22c55e;
    }
    .paginacion span {
      color: #f1f5f9;
      font-weight: bold;
    }

    /* ==== ESTILOS DE RESEÑAS ==== */
    .review-section {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      border: 2px solid #22c55e;
      margin: 40px 0;
    }
    .review-section h3 {
      color: #4ade80;
      margin-bottom: 20px;
      text-align: center;
    }
    .review-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    .review-group label {
      color: #38bdf8;
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .stars {
      display: flex;
      gap: 5px;
      font-size: 26px;
      cursor: pointer;
    }
    .stars i { color: #475569; transition: color 0.2s; }
    .stars i.activa { color: #facc15; }
    .review-textarea {
      width: 100%;
      min-height: 100px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      color: white;
      font-size: 14px;
      margin-bottom: 15px;
      resize: vertical;
    }
    .captcha-box {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #0f172a;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-bottom: 15px;
    }
    .captcha-muestra {
      background: #334155;
      padding: 8px 15px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 18px;
      color: #facc15;
      letter-spacing: 3px;
      user-select: none;
    }
    .captcha-box input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 16px;
    }
    .btn-submit-review {
      background: #22c55e;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      transition: background 0.2s;
    }
    .btn-submit-review:hover {
      background: #16a34a;
    }
    .mensaje-exito {
      color: #4ade80;
      text-align: center;
      margin-top: 12px;
      display: none;
    }

    /* ==== GRID DE PRODUCTOS: 5 por fila ==== */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
    }
    @media (max-width: 1200px) {
      .products-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 900px) {
      .products-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 400px) {
      .products-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="banner-header">
    <img src="logo.jpg" alt="Peque Elektro" class="banner-img">
  </header>

  <!-- BARRA DE BÚSQUEDA Y FILTROS -->
  <div class="buscador-filtros">
    <input type="text" id="buscar" placeholder="🔍 Buscar producto...">
    <select id="filtro-categoria">
      <option value="">Todas las Categorías</option>
    </select>
    <select id="filtro-subcategoria">
      <option value="">Todas las Subcategorías</option>
    </select>
  </div>

  <!-- SECCIÓN PRESENTACIÓN -->
  <section id="seccion-presentacion" class="presentacion">
    <h2 id="slogan-titulo"></h2>
    <p id="slogan-intro"></p>
    <div class="caracteristicas">
      <span id="slogan-item1"></span>
      <span id="slogan-item2"></span>
      <span id="slogan-item3"></span>
    </div>
    <div class="badge-boton" id="slogan-badge"></div>
  </section>

  <!-- CATÁLOGO DE PRODUCTOS -->
  <main class="main-container">
    <h2 class="titulo-seccion">Catálogo de Productos</h2>
    <div id="grid-productos" class="products-grid"></div>

    <!-- PAGINACIÓN: 5x6 = 30 por página -->
    <div class="paginacion">
      <button id="btn-anterior">&lt; Anterior</button>
      <span id="info-pagina">Página 1 de 1</span>
      <button id="btn-siguiente">Siguiente &gt;</button>
    </div>
  </main>

  <!-- SECCIÓN ENVÍOS -->
  <section class="envios-info">
    <h3><i class="fa-solid fa-truck-fast"></i> Información de Envíos</h3>
    <div class="envios-contenido">
      <p><strong>Puntos de Encuentro:</strong> <span id="envio-puntos"></span></p>
      <p><strong>Envíos por Correo:</strong> <span id="envio-correo"></span></p>
      <p class="condicion-entrega"><strong>Condición de Entrega:</strong> <span id="envio-condicion"></span></p>
    </div>
  </section>

  <!-- SECCIÓN RESEÑAS CON VERIFICACIÓN ANTI-ROBOT -->
  <section class="review-section">
    <h3><i class="fa-solid fa-star"></i> ¿Qué te pareció nuestra tienda?</h3>
    <form id="form-reseña">
      <div class="review-inputs">
        <div class="review-group">
          <label>Calificación del Producto:</label>
          <div class="stars" id="estrellas-producto">
            <i class="fa-solid fa-star" data-val="1"></i>
            <i class="fa-solid fa-star" data-val="2"></i>
            <i class="fa-solid fa-star" data-val="3"></i>
            <i class="fa-solid fa-star" data-val="4"></i>
            <i class="fa-solid fa-star" data-val="5"></i>
          </div>
          <input type="hidden" id="calificacion-producto" value="0">
        </div>
        <div class="review-group">
          <label>Calificación de la Atención:</label>
          <div class="stars" id="estrellas-atencion">
            <i class="fa-solid fa-star" data-val="1"></i>
            <i class="fa-solid fa-star" data-val="2"></i>
            <i class="fa-solid fa-star" data-val="3"></i>
            <i class="fa-solid fa-star" data-val="4"></i>
            <i class="fa-solid fa-star" data-val="5"></i>
          </div>
          <input type="hidden" id="calificacion-atencion" value="0">
        </div>
      </div>
      <label style="color: #38bdf8; font-weight: bold; display: block; margin-bottom: 6px;">Tu comentario:</label>
      <textarea id="comentario" class="review-textarea" placeholder="Escribe aquí tu opinión..."></textarea>

      <!-- VERIFICACIÓN ANTI-ROBOT (CAPTCHA SIMPLE) -->
      <div class="captcha-box">
        <label>Verifica que eres humano:</label>
        <div class="captcha-muestra" id="captcha-texto"></div>
        <input type="text" id="captcha-respuesta" placeholder="Escribe los números" autocomplete="off">
      </div>

      <button type="submit" class="btn-submit-review">✅ Enviar Reseña</button>
      <div class="mensaje-exito" id="mensaje-exito">¡Gracias por tu opinión! ✅</div>
    </form>
  </section>

  <!-- MODAL DEL CARRITO -->
  <div id="modal-carrito" class="modal-carrito">
    <div class="modal-contenido">
      <span class="cerrar-modal">&times;</span>
      <h2>Tu Pedido</h2>
      <div id="lista-carrito"></div>
      <div class="total-carrito">
        <strong>Total: $<span id="total-pedido">0</span></strong>
      </div>
      <button id="btn-enviar-whatsapp" class="btn-whatsapp">
        <i class="fa-brands fa-whatsapp"></i> Enviar por WhatsApp
      </button>
    </div>
  </div>

  <!-- SCRIPT PRINCIPAL -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTtYfbeNy7z15Pj3Suli68mVGioMFU21E",
      authDomain: "peque-elektro.firebaseapp.com",
      projectId: "peque-elektro",
      storageBucket: "peque-elektro.firebasestorage.app",
      messagingSenderId: "873169424486",
      appId: "1:873169424486:web:e9f77cb2052aa06b3b9da7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let productos = [];
    let categorias = new Set();
    let subcategorias = new Set();
    let carrito = [];

    // ==== PAGINACIÓN: 5 columnas × 6 filas = 30 productos por página ====
    const PRODUCTOS_POR_PAGINA = 30;
    let paginaActual = 1;
    let productosFiltrados = [];

    // ==== CARGAR TODO ====
    document.addEventListener("DOMContentLoaded", async () => {
      await Promise.all([
        cargarProductos(),
        cargarSlogan(),
        cargarConfigEnvios()
      ]);
      configurarFiltros();
      configurarPaginacion();
      configurarEstrellas();
      generarCaptcha();
      configurarFormularioReseña();
    });

    // ==== CARGAR PRODUCTOS ====
    async function cargarProductos() {
      const snap = await getDocs(collection(db, "productos"));
      productos = [];
      snap.forEach(d => {
        const p = { id: d.id, ...d.data() };
        productos.push(p);
        if (p.categoria) categorias.add(p.categoria);
        if (p.subcategoria) subcategorias.add(p.subcategoria);
      });
      productosFiltrados = [...productos];
      llenarSelectCategorias();
      renderizarPagina();
    }

    // ==== LLENAR FILTROS ====
    function llenarSelectCategorias() {
      const catSel = document.getElementById("filtro-categoria");
      const subSel = document.getElementById("filtro-subcategoria");
      categorias.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c; opt.textContent = c;
        catSel.appendChild(opt);
      });
    }

    function configurarFiltros() {
      const buscar = document.getElementById("buscar");
      const catSel = document.getElementById("filtro-categoria");
      const subSel = document.getElementById("filtro-subcategoria");

      const filtrar = () => {
        const t = buscar.value.toLowerCase().trim();
        const cat = catSel.value;
        const sub = subSel.value;
        productosFiltrados = productos.filter(p => {
          const coincideBusqueda = p.nombre.toLowerCase().includes(t);
          const coincideCat = !cat || p.categoria === cat;
          const coincideSub = !sub || p.subcategoria === sub;
          return coincideBusqueda && coincideCat && coincideSub;
        });
        paginaActual = 1;
        renderizarPagina();
      };

      buscar.addEventListener("input", filtrar);
      catSel.addEventListener("change", () => {
        subSel.innerHTML = '<option value="">Todas las Subcategorías</option>';
        productos.filter(p => !cat || p.categoria === cat).forEach(p => {
          if (p.subcategoria) {
            const opt = document.createElement("option");
            opt.value = p.subcategoria; opt.textContent = p.subcategoria;
            subSel.appendChild(opt);
          }
        });
        filtrar();
      });
      subSel.addEventListener("change", filtrar);
    }

    // ==== RENDERIZAR PÁGINA ACTUAL ====
    function renderizarPagina() {
      const grid = document.getElementById("grid-productos");
      const inicio = (paginaActual - 1) * PRODUCTOS_POR_PAGINA;
      const fin = inicio + PRODUCTOS_POR_PAGINA;
      const paginaProductos = productosFiltrados.slice(inicio, fin);

      if (paginaProductos.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#94a3b8;">No se encontraron productos.</p>';
      } else {
        grid.innerHTML = paginaProductos.map(p => {
          const img = (p.imagenes && p.imagenes[0]) || p.imagen || 'https://via.placeholder.com/300';
          const colores = p.colores?.length ? `<p class="colores-disponibles"><strong>Colores:</strong> ${p.colores.join(', ')}</p>` : '';
          return `
            <div class="product-card">
              <img src="${img}" alt="${p.nombre}">
              <h3>${p.nombre}</h3>
              <p class="price">$${parseFloat(p.precio).toLocaleString('es-AR')}</p>
              ${colores}
              <button class="agregar-carrito" data-id="${p.id}">Agregar al Pedido</button>
            </div>
          `;
        }).join('');
      }

      // Actualizar estado de paginación
      const totalPaginas = Math.ceil(productosFiltrados.length / PRODUCTOS_POR_PAGINA);
      document.getElementById("info-pagina").textContent = `Página ${paginaActual} de ${totalPaginas || 1}`;
      document.getElementById("btn-anterior").disabled = paginaActual <= 1;
      document.getElementById("btn-siguiente").disabled = paginaActual >= totalPaginas;

      // Asignar eventos a botones "Agregar al Pedido"
      document.querySelectorAll(".agregar-carrito").forEach(btn => {
        btn.addEventListener("click", () => {
          const prod = productos.find(p => p.id === btn.dataset.id);
          if (prod) agregarAlCarrito(prod);
        });
      });
    }

    // ==== CONTROLES DE PAGINACIÓN ====
    function configurarPaginacion() {
      document.getElementById("btn-anterior").addEventListener("click", () => {
        if (paginaActual > 1) { paginaActual--; renderizarPagina(); window.scrollTo({top: 300, behavior:'smooth'}); }
      });
      document.getElementById("btn-siguiente").addEventListener("click", () => {
        const totalPaginas = Math.ceil(productosFiltrados.length / PRODUCTOS_POR_PAGINA);
        if (paginaActual < totalPaginas) { paginaActual++; renderizarPagina(); window.scrollTo({top: 300, behavior:'smooth'}); }
      });
    }

    // ==== CARRITO DE COMPRAS ====
    function agregarAlCarrito(producto) {
      const existe = carrito.find(i => i.id === producto.id);
      if (existe) existe.cantidad++;
      else carrito.push({ ...producto, cantidad: 1 });
      actualizarCarrito();
      document.getElementById("modal-carrito").classList.add("abierto");
    }

    function actualizarCarrito() {
      const lista = document.getElementById("lista-carrito");
      if (carrito.length === 0) {
        lista.innerHTML = "<p>Tu pedido está vacío.</p>";
        document.getElementById("total-pedido").textContent = "0";
        return;
      }
      let total = 0;
      lista.innerHTML = carrito.map(item => {
        const subtotal = parseFloat(item.precio) * item.cantidad;
        total += subtotal;
        return `
          <div class="item-carrito">
            <span>${item.nombre}</span>
            <div class="cantidad-control">
              <button class="menos" data-id="${item.id}">-</button>
              <span>${item.cantidad}</span>
              <button class="mas" data-id="${item.id}">+</button>
            </div>
            <span>$${subtotal.toLocaleString('es-AR')}</span>
          </div>
        `;
      }).join('');
      document.getElementById("total-pedido").textContent = total.toLocaleString('es-AR');

      document.querySelectorAll(".menos").forEach(b => b.addEventListener("click", () => cambiarCantidad(b.dataset.id, -1)));
      document.querySelectorAll(".mas").forEach(b => b.addEventListener("click", () => cambiarCantidad(b.dataset.id, 1)));
    }

    function cambiarCantidad(id, delta) {
      const item = carrito.find(i => i.id === id);
      if (!item) return;
      item.cantidad += delta;
      if (item.cantidad <= 0) carrito = carrito.filter(i => i.id !== id);
      actualizarCarrito();
    }

    // Enviar por WhatsApp + Guardar Pedido en Firestore
    document.getElementById("btn-enviar-whatsapp").addEventListener("click", async () => {
      if (carrito.length === 0) return alert("Tu pedido está vacío.");

      const numeroOrden = `ORD-${Date.now()}`;
      const total = carrito.reduce((sum, i) => sum + parseFloat(i.precio) * i.cantidad, 0);
      const items = carrito.map(i => ({
        nombre: i.nombre,
        cantidad: i.cantidad,
        precio: parseFloat(i.precio)
      }));

      // Guardar en Firestore
      await addDoc(collection(db, "pedidos"), {
        numeroOrden,
        productos: items,
        total,
        fecha: new Date(),
        estado: "Pendiente"
      });

      // Mensaje WhatsApp
      const texto = `🛒 *NUEVO PEDIDO - Peque Elektro*

📝 *Orden:* ${numeroOrden}

${items.map(i => `✅ ${i.nombre} × ${i.cantidad} → $${(i.precio * i.cantidad).toLocaleString('es-AR')}`).join('\n')}

💰 *TOTAL: $${total.toLocaleString('es-AR')}*

Por favor, avísame cómo continuamos con la compra. ¡Gracias!`;

      window.open(`https://wa.me/5491158144927?text=${encodeURIComponent(texto)}`, "_blank");
      carrito = [];
      actualizarCarrito();
      document.getElementById("modal-carrito").classList.remove("abierto");
    });

    // Cerrar modal
    document.querySelector(".cerrar-modal").addEventListener("click", () => {
      document.getElementById("modal-carrito").classList.remove("abierto");
    });

    // ==== CARGAR PRESENTACIÓN ====
    async function cargarSlogan() {
      const snap = await getDoc(doc(db, "configuracion", "slogan")).catch(() => null);
      if (snap?.exists()) {
        const d = snap.data();
        document.getElementById("slogan-titulo").textContent = d.titulo || "";
        document.getElementById("slogan-intro").textContent = d.intro || "";
        document.getElementById("slogan-item1").textContent = d.item1 || "";
        document.getElementById("slogan-item2").textContent = d.item2 || "";
        document.getElementById("slogan-item3").textContent = d.item3 || "";
        document.getElementById("slogan-badge").textContent = d.badge || "";
      }
    }

    // ==== CARGAR ENVÍOS ====
    async function cargarConfigEnvios() {
      const snap = await getDoc(doc(db, "configuracion", "envios")).catch(() => null);
      if (snap?.exists()) {
        const d = snap.data();
        document.getElementById("envio-puntos").textContent = d.puntos || "";
        document.getElementById("envio-correo").textContent = d.correo || "";
        document.getElementById("envio-condicion").textContent = d.condicion || "";
      }
    }

    // ==== SISTEMA DE ESTRELLAS PARA RESEÑAS ====
    function configurarEstrellas() {
      configurarGrupoEstrellas("estrellas-producto", "calificacion-producto");
      configurarGrupoEstrellas("estrellas-atencion", "calificacion-atencion");
    }
    function configurarGrupoEstrellas(contId, inputId) {
      const cont = document.getElementById(contId);
      const input = document.getElementById(inputId);
      const estrellas = cont.querySelectorAll("i");
      estrellas.forEach(est => {
        est.addEventListener("click", () => {
          const val = parseInt(est.dataset.val);
          input.value = val;
          estrellas.forEach((e, idx) => {
            e.classList.toggle("activa", idx < val);
          });
        });
      });
    }

    // ==== CAPTCHA ANTI-ROBOT ====
    let captchaCorrecto = "";
    function generarCaptcha() {
      const a = Math.floor(Math.random() * 9) + 1;
      const b = Math.floor(Math.random() * 9) + 1;
      captchaCorrecto = `${a + b}`;
      document.getElementById("captcha-texto").textContent = `${a} + ${b} = ?`;
      document.getElementById("captcha-respuesta").value = "";
    }

    // ==== ENVIAR RESEÑA ====
    function configurarFormularioReseña() {
      document.getElementById("form-reseña").addEventListener("submit", async (e) => {
        e.preventDefault();
        const resp = document.getElementById("captcha-respuesta").value.trim();
        if (resp !== captchaCorrecto) {
          alert("❌ Verificación incorrecta. Intenta nuevamente.");
          generarCaptcha();
          return;
        }
        const calProd = document.getElementById("calificacion-producto").value;
        const calAten = document.getElementById("calificacion-atencion").value;
        const coment = document.getElementById("comentario").value.trim();
        if (calProd == 0 || calAten == 0) {
          return alert("Por favor califica con estrellas.");
        }
        await addDoc(collection(db, "resenias"), {
          calificacionProducto: parseInt(calProd),
          calificacionAtencion: parseInt(calAten),
          comentario: coment,
          fecha: new Date()
        });
        document.getElementById("mensaje-exito").style.display = "block";
        document.getElementById("form-reseña").reset();
        document.querySelectorAll(".stars i").forEach(e => e.classList.remove("activa"));
        setTimeout(() => {
          document.getElementById("mensaje-exito").style.display = "none";
        }, 4000);
        generarCaptcha();
      });
    }
  </script>
</body>
</html>
